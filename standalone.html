<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>湖南绿盾卫士检测技术有限公司 - 在线考试系统</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}

:root{

  --primary:#1a3a6b;--primary-light:#2a5aaa;--primary-dark:#0d2247;

  --accent:#c9a84c;--accent-light:#f0d080;--accent-dark:#a07830;

  --bg:#e8edf4;--card:#fff;--text:#1a1a2e;--text-light:#5a6a7a;

  --border:#d0d8e4;--success:#1a8a4a;--danger:#c0392b;--warn:#e67e22;

}

body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ===== 顶部导航 ===== */

.topbar{

  background:linear-gradient(135deg,#1a3a6b 0%,#0d2247 100%);color:#fff;

  padding:0 40px;height:64px;display:flex;align-items:center;

  box-shadow:0 2px 16px rgba(10,30,70,.35);position:sticky;top:0;z-index:100;

}

.topbar-logo{display:flex;align-items:center;gap:12px;flex:1}

.topbar-logo .shield{width:40px;height:40px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}

.topbar-logo .name{font-size:17px;font-weight:700;letter-spacing:.5px}

.topbar-logo .sub{font-size:11px;opacity:.7;letter-spacing:1px}

.topbar-right{display:flex;align-items:center;gap:10px}

.topbar-right .user-icon{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer}

.topbar-right .btn-bar{background:rgba(201,168,76,.2);border:1px solid rgba(201,168,76,.4);color:var(--accent-light);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:background .2s}

.topbar-right .btn-bar:hover{background:rgba(201,168,76,.35)}

/* ===== 通用 ===== */

.page{padding:40px 20px;max-width:1200px;margin:0 auto;animation:fadeUp .3s ease}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);border-radius:16px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--border);margin-bottom:24px}

.card-title{font-size:17px;font-weight:700;color:var(--primary);margin-bottom:24px;padding-bottom:14px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px}

.card-title::before{content:'';width:4px;height:22px;background:var(--accent);border-radius:2px}

/* ===== 通用组件 ===== */

.btn{border:none;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}

.btn:hover{transform:translateY(-1px)}

.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 3px 12px rgba(26,58,107,.3)}

.btn-accent{background:linear-gradient(135deg,#c9a84c,#e0bc5a);color:#fff;box-shadow:0 3px 12px rgba(201,168,76,.35)}

.btn-ghost{background:#f1f4f8;color:var(--text);border:1px solid var(--border)}

.btn-ghost:hover{background:#e8edf4}

.btn-danger{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}

.btn-sm{padding:7px 14px;font-size:13px;border-radius:8px;border:none;cursor:pointer;font-weight:600}

.btn-sm-danger{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}

.btn-sm-primary{background:#eef2ff;color:var(--primary-light);border:1px solid #c7d2fe}

.btn-sm-accent{background:#fff8e8;color:#b06000;border:1px solid #f0c040}

.footer{text-align:center;padding:28px 20px;font-size:12px;color:var(--text-light)}

/* ===== Toast ===== */

.toast{position:fixed;top:80px;right:20px;background:#fff;border-radius:12px;padding:14px 20px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:300;font-size:14px;display:none;animation:fadeUp .2s ease;min-width:200px}

.toast.show{display:block}

.toast.success{border-left:4px solid var(--success)}

.toast.error{border-left:4px solid var(--danger)}

.toast.info{border-left:4px solid var(--primary)}

/* ===== 模态弹窗 ===== */

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}

.modal-box{background:#fff;border-radius:20px;padding:40px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;animation:fadeUp .25s ease}

.modal-box h3{font-size:20px;color:var(--primary);margin-bottom:6px}

.modal-box .modal-sub{font-size:13px;color:var(--text-light);margin-bottom:24px;line-height:1.6}

.modal-close{position:absolute;top:16px;right:20px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);line-height:1}

.modal-close:hover{color:var(--text)}

.modal-actions{display:flex;gap:10px;justify-content:center;margin-top:20px}

.modal-row{display:flex;flex-direction:column;gap:16px}

/* ===== 表单字段 ===== */

.field{width:100%}

.field label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;display:block}

.field input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:15px;outline:none;transition:border-color .2s}

.field input:focus{border-color:var(--primary-light)}

.field .hint{font-size:11px;color:var(--text-light);margin-top:4px}

/* ===== 验证码 ===== */

.captcha-row{display:flex;gap:10px;align-items:flex-end}

.captcha-row .field{flex:1}

.captcha-canvas{border-radius:10px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;height:46px;transition:border-color .2s}

.captcha-canvas:hover{border-color:var(--primary-light)}

/* ===== 登录页 ===== */

/* ===== 认证页（政府事业单位风格） ===== */

.auth-page-wrap{min-height:calc(100vh - 64px);display:flex;flex-direction:column}

/* 顶部机构栏 */

.auth-page-footer{text-align:center;font-size:12px;color:var(--text-light);padding:18px 20px;letter-spacing:.5px;border-top:1px solid var(--border);background:#fff}

/* 主内容 */

.auth-main{display:flex;flex:1;max-width:1200px;width:100%;margin:0 auto;padding:40px;gap:60px;align-items:stretch}

/* 左侧品牌区 */

.auth-brand{flex:1;display:flex;align-items:center;background:linear-gradient(160deg,#1a3a6b 0%,#0d2247 60%,#1a3a8a 100%);border-radius:20px;padding:44px;position:relative;overflow:hidden;min-height:460px}

.auth-brand::before{content:'';position:absolute;right:-40px;bottom:-40px;width:200px;height:200px;background:rgba(201,168,76,.1);border-radius:50%}

.auth-brand::after{content:'';position:absolute;left:-30px;top:-30px;width:160px;height:160px;background:rgba(201,168,76,.07);border-radius:50%}

.auth-brand-inner{position:relative;z-index:1}

.auth-brand-logo{font-size:52px;margin-bottom:20px}

.auth-brand-title{font-size:26px;font-weight:900;color:#fff;line-height:1.35;margin-bottom:16px;letter-spacing:1px}

.auth-brand-desc{font-size:14px;color:rgba(255,255,255,.7);line-height:1.8;margin-bottom:32px}

.auth-brand-features{display:flex;flex-direction:column;gap:14px}

.auth-brand-feat{display:flex;align-items:flex-start;gap:14px;background:rgba(255,255,255,.07);border-radius:12px;padding:14px 16px;border:1px solid rgba(255,255,255,.1)}

.auth-brand-feat-icon{font-size:24px;flex-shrink:0}

.auth-brand-feat-t{font-size:14px;font-weight:700;color:#fff;margin-bottom:3px}

.auth-brand-feat-d{font-size:12px;color:rgba(255,255,255,.6);line-height:1.5}

/* 右侧表单区 */

.auth-form-area{flex:1;max-width:420px;display:flex;flex-direction:column}

.auth-form-tabs{display:flex;margin-bottom:0;align-items:flex-end;padding:0}

.auth-form-tab{position:relative;flex:1;text-align:center;padding:14px 20px;font-size:15px;font-weight:600;color:var(--text-light);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;letter-spacing:.5px;background:transparent}

.auth-form-tab.active{

  color:#fff;

  font-size:16px;

  font-weight:700;

  letter-spacing:2px;

  padding:16px 28px 18px;

  margin-bottom:-4px;

  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 60%,var(--accent) 100%);

  border-bottom:none;

  clip-path:polygon(0 0, calc(100% - 22px) 0, 100% 100%, 0 100%);

  box-shadow:0 6px 20px rgba(26,58,107,0.4),0 2px 6px rgba(26,58,107,0.2),inset 0 1px 0 rgba(255,255,255,0.25);

  filter:drop-shadow(0 4px 10px rgba(26,58,107,0.35));

  z-index:1;

}

.auth-form-tab.active::before{

  content:"";

  position:absolute;

  bottom:0;left:0;right:22px;height:3px;

  background:linear-gradient(90deg,rgba(255,255,255,0.5),rgba(255,255,255,0.1));

  border-radius:2px 2px 0 0;

}

.auth-form-tab.active::after{

  content:"";

  position:absolute;

  top:2px;right:26px;

  width:6px;height:6px;border-radius:50%;

  background:rgba(255,255,255,0.7);

  box-shadow:0 0 6px rgba(255,255,255,0.8);

}

.auth-form-tab:hover:not(.active){color:var(--text)}

.auth-form-wrap{background:var(--card);border-radius:0 0 20px 20px;padding:30px 34px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.07);flex:1}

.auth-form{display:none;flex-direction:column;gap:14px}

.auth-form.active{display:flex}

/* 表单行 */

.af-row{display:flex;align-items:flex-start;gap:0}

.af-icon{width:36px;height:36px;background:#f0f4ff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:26px;border:1px solid #dde4ff}

.af-field{flex:1;padding-left:12px}

.af-label{font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:6px;padding-left:4px;letter-spacing:.5px}

.af-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border-color .2s;background:#fff}

.af-input:focus{border-color:var(--primary-light);background:#f8faff}

.af-pw-wrap{position:relative}

.af-pw-wrap .af-input{padding-right:42px}

.af-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--text-light);padding:4px}

.af-captcha-row{display:flex;gap:8px;align-items:flex-end}

.af-cap-in{flex:1}

.af-canvas{border-radius:8px;border:1.5px solid var(--border);cursor:pointer;flex-shrink:0;height:44px;background:#f8faff;transition:border-color .2s}

.af-canvas:hover{border-color:var(--primary-light)}

.af-sms-btn{background:#fff;border:1.5px solid var(--primary);color:var(--primary);padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s}

.af-sms-btn:hover{background:var(--primary);color:#fff}

.af-hint{font-size:11px;color:var(--text-light);margin-top:5px;line-height:1.5}

.af-submit-btn{width:100%;padding:13px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1a3a6b,#1a5a9a);border:none;border-radius:10px;cursor:pointer;letter-spacing:2px;margin-top:4px;transition:opacity .2s,transform .15s;box-shadow:0 4px 14px rgba(26,58,107,.3)}

.af-submit-btn:hover{opacity:.88;transform:translateY(-1px)}

.af-reg-btn{background:linear-gradient(135deg,#c9a84c,#e0bc5a);box-shadow:0 4px 14px rgba(201,168,76,.3)}

.af-links{text-align:center;margin-top:10px;display:flex;justify-content:center;gap:8px;align-items:center}

.af-link-sep{color:var(--border);font-size:12px}

.af-link-primary{font-size:13px;color:var(--primary);font-weight:600;text-decoration:none;cursor:pointer}

.af-link-primary:hover{text-decoration:underline}

.af-link-ghost{font-size:13px;color:var(--text-light);text-decoration:none;cursor:pointer}

.af-link-ghost:hover{color:var(--text)}

@media(max-width:900px){

  .auth-brand{display:none}

  .auth-main{padding:20px 16px;gap:0}

  .auth-form-area{max-width:100%;width:100%}

}

@media(max-width:480px){

  .auth-form-wrap{padding:24px 20px}

}

/* ===== 首页 Hero ===== */

.hero{background:linear-gradient(135deg,#1a3a6b 0%,#1a5a9a 50%,#0d2247 100%);border-radius:20px;padding:56px 50px;margin-bottom:36px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden}

.hero::before{content:'';position:absolute;right:-60px;top:-60px;width:280px;height:280px;background:rgba(201,168,76,.12);border-radius:50%}

.hero-text{position:relative;z-index:1}

.hero-text h1{font-size:30px;font-weight:700;color:#fff;margin-bottom:10px}

.hero-text p{font-size:14px;color:rgba(255,255,255,.7);line-height:1.7;max-width:480px}

.hero-badge{background:rgba(201,168,76,.2);border:1px solid rgba(201,168,76,.4);border-radius:16px;padding:16px 24px;text-align:center;color:var(--accent-light);position:relative;z-index:1}

.hero-badge .num{font-size:36px;font-weight:800;display:block;color:#fff}

/* ===== 试卷选择 ===== */

.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}

.paper-card{border:2px solid var(--border);border-radius:16px;padding:22px;transition:all .2s;cursor:pointer;background:var(--card)}

.paper-card:hover{border-color:var(--primary-light);box-shadow:0 6px 24px rgba(26,58,107,.12);transform:translateY(-2px)}

.paper-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}

.paper-title{font-size:15px;font-weight:700;line-height:1.4}

.paper-tag{background:#eef2ff;color:var(--primary-light);border-radius:8px;padding:3px 10px;font-size:12px;flex-shrink:0;margin-left:10px}

.paper-desc{font-size:13px;color:var(--text-light);line-height:1.5;margin-bottom:14px}

.paper-meta{display:flex;gap:14px;font-size:12px;color:var(--text-light);margin-bottom:18px;flex-wrap:wrap}

.paper-meta span{display:flex;align-items:center;gap:4px}

.paper-meta .dot{width:5px;height:5px;background:var(--accent);border-radius:50%;flex-shrink:0}

.paper-btn{width:100%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:10px;padding:11px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}

.paper-btn:hover{opacity:.88}

/* ===== 考试页面 ===== */

.page-exam{display:flex;gap:22px;max-width:1280px;margin:0 auto;padding:24px 20px;align-items:flex-start}

.sidebar{width:210px;flex-shrink:0;position:sticky;top:80px}

.sidebar .card{padding:18px}

.sidebar-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:14px}

.q-nav{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}

.q-group-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-light);margin-bottom:8px}

.q-group-title .q-badge{display:inline-block;width:3px;height:13px;border-radius:2px;background:var(--primary-light)}

.q-group-range{margin-left:6px;font-weight:500;font-size:11px;color:#9aa6b4}

.q-group-dots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}

.q-dot{width:34px;height:34px;border-radius:7px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-light);cursor:pointer;transition:all .15s}

.q-dot.answered{border-color:var(--primary-light);background:#eef2ff;color:var(--primary-light)}

.q-dot.current{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(201,168,76,.4)}

.q-legend{display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--text-light)}

.timer-box{background:#fff8e8;border:1px solid #e8d090;border-radius:12px;padding:12px;margin-top:14px;text-align:center}

.timer-label{font-size:11px;color:var(--warn);font-weight:600;margin-bottom:3px}

.timer-num{font-size:26px;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums}

.exam-main{flex:1;min-width:0}

.exam-header{background:var(--card);border-radius:16px;padding:22px 26px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--border);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}

.exam-header h2{font-size:17px;color:var(--primary)}

.exam-info{display:flex;gap:18px;font-size:13px;color:var(--text-light)}

.exam-info strong{color:var(--text)}

.progress-bar{width:100%;height:5px;background:#e8edf4;border-radius:3px;overflow:hidden;margin-top:3px}

.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--primary-light));border-radius:3px;transition:width .4s}

.question-card{background:var(--card);border-radius:16px;padding:26px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--border);margin-bottom:18px}

.q-type{display:inline-block;border-radius:6px;padding:3px 12px;font-size:12px;font-weight:700;margin-bottom:14px;letter-spacing:.5px}

.q-stem{font-size:15px;line-height:1.7;font-weight:600;margin-bottom:18px}

.options{list-style:none;display:flex;flex-direction:column;gap:9px}

.option-item{display:flex;align-items:center;gap:13px;padding:12px 16px;border:2px solid var(--border);border-radius:11px;cursor:pointer;transition:border-color .15s,background .15s}

.option-item:hover{border-color:var(--primary-light);background:#f5f7ff}

.option-item.selected{border-color:var(--primary);background:#eef2ff}

.opt-letter{width:30px;height:30px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all .15s}

.opt-text{flex:1;font-size:14px;line-height:1.4}

.short-area textarea{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:11px;font-size:14px;line-height:1.6;resize:vertical;min-height:110px;font-family:inherit;outline:none;transition:border-color .2s}

.short-area textarea:focus{border-color:var(--primary-light)}

.q-nav-bottom{display:flex;gap:10px;flex-wrap:wrap}

.unanswered-alert{background:#fef3cd;border:1px solid #f0c040;color:#7a5000;border-radius:11px;padding:14px 18px;margin-bottom:16px;font-size:13px}

/* ===== 结果页 ===== */

.page-result{max-width:960px;margin:0 auto;padding:40px 20px}

.result-hero{text-align:center;padding:56px 40px;background:linear-gradient(135deg,#1a3a6b,#0d2247);border-radius:24px;margin-bottom:36px;position:relative;overflow:hidden}

.result-hero::before{content:'✓';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:200px;color:rgba(201,168,76,.08);line-height:1}

.result-icon{width:76px;height:76px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 18px;position:relative}

.result-hero h1{font-size:34px;color:#fff;margin-bottom:10px;position:relative}

.result-score{font-size:68px;font-weight:900;color:var(--accent-light);margin-bottom:6px;position:relative}

.result-sub{font-size:15px;color:rgba(255,255,255,.65);position:relative}

.cert-box{background:var(--card);border-radius:20px;border:2px solid var(--accent);padding:44px 56px;text-align:center;margin-bottom:30px;position:relative}

.cert-box::before,.cert-box::after{content:'★';position:absolute;top:18px;font-size:18px;color:var(--accent)}

.cert-box::before{left:28px}.cert-box::after{right:28px}

.cert-title{font-size:12px;letter-spacing:7px;color:var(--text-light);margin-bottom:6px}

.cert-company{font-size:22px;font-weight:900;color:var(--primary);margin-bottom:22px;letter-spacing:2px}

.cert-line{border-top:1px dashed var(--border);margin:22px 0}

.cert-name{font-size:20px;font-weight:700;margin:14px 0;letter-spacing:4px}

.cert-score{font-size:44px;font-weight:900;color:var(--accent);margin:14px 0}

.cert-status{display:inline-block;font-size:18px;font-weight:800;padding:7px 28px;border-radius:30px;margin-top:10px}

.cert-status.pass{background:#f0fdf4;color:var(--success);border:2px solid var(--success)}

.cert-status.fail{background:#fef2f2;color:var(--danger);border:2px solid var(--danger)}

.cert-date{font-size:13px;color:var(--text-light);margin-top:18px}

.cert-id{font-size:12px;color:#b0bec5;margin-top:5px;font-family:monospace}

.result-detail{background:var(--card);border-radius:16px;border:1px solid var(--border);overflow:hidden;margin-bottom:30px}

.result-detail-header{background:#f5f7ff;padding:18px 26px;font-size:15px;font-weight:700;color:var(--primary);border-bottom:1px solid var(--border)}

.result-detail-body{padding:22px 26px}

.detail-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}

<script>

// ===== 默认题库 =====

let DEFAULT_QUESTIONS = [];

// ===== 存储管理 =====

const ADMIN_KEY = "exam_admin_config";

const USERS_KEY = "exam_users";

const QUESTIONS_KEY = "exam_questions_v2";

const RECORDS_KEY = "exam_records";

const SESSION_KEY = "exam_session";

function getAdminConfig() {

  try {

    let raw = localStorage.getItem(ADMIN_KEY);

    if (raw) {

      let cfg = JSON.parse(raw);

      if (cfg && typeof cfg.pin !== 'undefined') return cfg;

    }

  } catch(e) {

    console.warn('管理员配置损坏，已重置:', e.message);

    localStorage.removeItem(ADMIN_KEY);

  }

  let cfg = { pin: "888888", users: [] };

  localStorage.setItem(ADMIN_KEY, JSON.stringify(cfg));

  return cfg;

}

function saveAdminConfig(cfg) { localStorage.setItem(ADMIN_KEY, JSON.stringify(cfg)); }

function getUsers() {

  try {

    let raw = localStorage.getItem(USERS_KEY);

    if (raw) {

      let u = JSON.parse(raw);

      if (Array.isArray(u)) return u;

    }

  } catch(e) {

    localStorage.removeItem(USERS_KEY);

  }

  return [];

}

function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

function getQuestions() {

  try {

    let raw = localStorage.getItem(QUESTIONS_KEY);

    if (raw) {

      let q = JSON.parse(raw);

      if (q && Array.isArray(q) && q.length > 0) return q;

    }

  } catch(e) {

    console.warn('题库数据损坏，已清除:', e.message);

    localStorage.removeItem(QUESTIONS_KEY);

  }

  return JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));

}

function saveQuestions(q) { localStorage.setItem(QUESTIONS_KEY, JSON.stringify(q)); }

function getRecords() {

  try {

    let raw = localStorage.getItem(RECORDS_KEY);

    if (raw) {

      let r = JSON.parse(raw);

      if (Array.isArray(r)) return r;

    }

  } catch(e) {

    localStorage.removeItem(RECORDS_KEY);

  }

  return [];

}

function saveRecords(r) { localStorage.setItem(RECORDS_KEY, JSON.stringify(r)); }

// ===== 全局状态 =====

let questions = getQuestions();

let currentUser = (function(){

  try {

    let raw = localStorage.getItem(SESSION_KEY);

    if (raw) return JSON.parse(raw);

  } catch(e) {

    localStorage.removeItem(SESSION_KEY);

  }

  return null;

})();

let isAdmin = false;

let state = { view: "auth", authTab: "login", candName: "", taskId: 1, questions: [], answers: {}, currentQ: 0, submitted: false, score: 0, passed: false, resultFilter: "all", recordIndex: -1 };

let timerInterval = null;

let currentCaptcha = { code: "", ops: [] };

// ===== 工具函数 =====

function $ (id) { return document.getElementById(id); }

function esc (s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function totalScore (qs) { return (qs || questions).reduce((s,q)=>s+q.score,0); }

function showToast (msg, type="info") {

  let t = $("toast");

  t.textContent = msg; t.className = "toast " + type + " show";

  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 3000);

}

// ===== 验证码系统 =====

const CAPTCHA_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function generateCaptcha() {

  let ops = [], code = "";

  for (let i = 0; i < 4; i++) {

    let n = Math.floor(Math.random() * 10);

    ops.push({ label: `${n} + ? = ${n + Math.floor(Math.random()*5+1)}`, answer: Math.floor(Math.random()*5+1) });

    code += n;

  }

  currentCaptcha = { code, ops, index: 0, answer: null };

  return ops;

}

function getCaptchaQ() {

  if (!currentCaptcha.ops.length) generateCaptcha();

  return currentCaptcha.ops[currentCaptcha.index % currentCaptcha.ops.length];

}

function renderCaptchaCanvas(canvas) {

  if (!canvas) return;

  let ctx = canvas.getContext("2d");

  let W = canvas.width = 140;

  let H = canvas.height = 46;

  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = "#eef2ff";

  ctx.fillRect(0, 0, W, H);

  // 干扰线

  for (let i = 0; i < 4; i++) {

    ctx.strokeStyle = "rgba(26,58,107," + (0.1 + Math.random()*0.15) + ")";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(Math.random()*W, Math.random()*H);

    ctx.lineTo(Math.random()*W, Math.random()*H);

    ctx.stroke();

  }

  // 噪点

  for (let i = 0; i < 30; i++) {

    ctx.fillStyle = "rgba(26,58,107,0.15)";

    ctx.fillRect(Math.random()*W, Math.random()*H, 2, 2);

  }

  let q = getCaptchaQ();

  ctx.fillStyle = "#1a3a6b";

  ctx.font = "bold 13px PingFang SC, Microsoft YaHei";

  ctx.textAlign = "center";

  ctx.fillText(q.label, W/2, H/2 + 5);

  // 重绘按钮

  let bx = W - 30, by = H/2 - 12;

  ctx.fillStyle = "transparent";

  ctx.strokeStyle = "#1a3a6b";

  ctx.lineWidth = 1.5;

  ctx.strokeRect(bx, by, 24, 24);

  ctx.fillStyle = "#1a3a6b";

  ctx.font = "10px sans-serif";

  ctx.fillText("↻", bx+12, by+15);

}

// ===== 密码工具 =====

function hashPin(pin) {

  // 简单哈希，用于存储（本地存储，非高安全场景）

  let h = 5381;

  for (let i = 0; i < pin.length; i++) h = ((h << 5) + h) + pin.charCodeAt(i);

  return h.toString(36);

}

function checkPinStrength(pin) {

  let score = 0;

  if (pin.length >= 6) score++;

  if (/\d/.test(pin)) score++;

  if (/[A-Za-z]/.test(pin)) score++;

  if (/[^A-Za-z0-9]/.test(pin)) score++;

  if (pin.length >= 10) score++;

  return score;

}

// ===== 登录注册逻辑 =====

function doLogin() {

  let username = $("login-username")?.value?.trim();

  let pw = $("login-pw")?.value;

  if (!username || !pw) { showToast("请填写用户名和密码", "error"); return; }

  let users = getUsers();

  let user = users.find(u => u.username === username && u.pwHash === hashPin(pw));

  if (!user) {

    showToast("用户名或密码错误", "error");

    return;

  }

  currentUser = { name: user.name, username: user.username, isAdmin: !!user.isAdmin };

  isAdmin = !!user.isAdmin;

  localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));

  showToast("欢迎回来，" + user.name + "！", "success");

  state.view = "home";

  render();

}

function doRegister() {

  let name = $("reg-name")?.value?.trim();

  let username = $("reg-username")?.value?.trim();

  let pw = $("reg-pw")?.value;

  let pw2 = $("reg-pw2")?.value;

  if (!name) { showToast("请输入真实姓名", "error"); return; }

  if (!username || username.length < 2) { showToast("请输入正确的用户名（至少2位）", "error"); return; }

  if (pw.length < 6) { showToast("密码至少6位", "error"); return; }

  if (pw !== pw2) { showToast("两次密码不一致", "error"); return; }

  let users = getUsers();

  if (users.find(u => u.username === username)) {

    showToast("该用户名已注册，请直接登录", "error");

    switchAuthTab("login");

    return;

  }

  let role = ($("reg-role")?.value || "").trim();

  if (!role) { showToast("请选择岗位类型", "error"); return; }

  users.push({ name, username, pwHash: hashPin(pw), role: role, isAdmin: false, createdAt: new Date().toISOString() });

  saveUsers(users);

  currentUser = { name, username, role: role, isAdmin: false };

  isAdmin = false;

  localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));

  showToast("注册成功！欢迎 " + name, "success");

  state.view = "home";

  render();

}

  if (isAdmin) { state.view = "admin"; render(); return; }

  let html = `<div class="modal-overlay" id="admin-login-modal">

    <div class="modal-box">

      <button class="modal-close" onclick="closeModalForce()">×</button>

      <h3>⚙️ 管理员登录</h3>

      <p style="font-size:13px;color:var(--text-light);margin-bottom:24px;line-height:1.6">请输入管理员 PIN 码</p>

      <div class="modal-row">

        <div class="field">

          <label>PIN 码</label>

          <div class="input-wrap">

            <input type="password" id="admin-pin" placeholder="请输入 6 位 PIN" maxlength="6" onkeydown="if(event.key==='Enter')verifyAdminPin()">

            <button class="eye-btn" onclick="togglePw('admin-pin',this)">👁</button>

          </div>

        </div>

      </div>

      <div class="modal-actions">

        <button class="btn btn-ghost" onclick="closeModalForce()">取消</button>

        <button class="btn btn-primary" onclick="verifyAdminPin()">确认登录</button>

      </div>

    </div>

  </div>`;

  document.body.insertAdjacentHTML("beforeend", html);

  setTimeout(() => $("admin-pin")?.focus(), 100);

}

function verifyAdminPin() {

  let pin = $("admin-pin")?.value;

  let cfg = getAdminConfig();

  if (pin === cfg.pin) {

    closeModalForce();

    isAdmin = true;

    if (currentUser) currentUser.isAdmin = true;

    showToast("管理员登录成功", "success");

    state.view = "admin";

    render();

  } else {

    showToast("PIN 错误", "error");

    $("admin-pin").value = "";

    $("admin-pin").focus();

  }

}

function closeModalForce() {

  document.getElementById("admin-login-modal")?.remove();

}

// ===== 模块入口 =====

function enterModule(id) {

  if (id === "exam") {

    startExam();

  } else if (id === "practice") {

    startPractice();

  } else if (id === "library") {

    state.view = "library";

    render();

  } else if (id === "laws" || id === "expert" || id === "mgmt") {

    state.currentModule = id;

    state.currentChapter = 0;

    state.view = "module-content";

    render();

    scrollTo(0, 0);

  }

}

function startPractice() {

  if (!currentUser) { showToast("请先登录", "error"); return; }

  // 刷题模式：随机抽题，即时反馈

  state.questions = shuffleArray(questions.slice()).slice(0, 10); // 先随机抽10题

  state.answers = {};

  state.currentQ = 0;

  state.practiceMode = true;

  state.view = "exam";

  render();

}

function shuffleArray(arr) {

  let a = arr.slice();

  for (let i = a.length - 1; i > 0; i--) {

    let j = Math.floor(Math.random() * (i + 1));

    [a[i], a[j]] = [a[j], a[i]];

  }

  return a;

}

// ===== 考试 =====

function startExam() {
  if (!currentUser) { showToast("请先登录", "error"); return; }
  state.candName = currentUser.name;
  var userRole = currentUser.role;
  if (!userRole) { showToast("未设置岗位，请联系管理员", "error"); return; }

  var isConcurrent = !!document.getElementById("exam-concurrent") && document.getElementById("exam-concurrent").checked;
  var effRole = userRole;
  if (isConcurrent) {
    var concurrentTarget = CONCURRENT_MAP[userRole] || "";
    if (concurrentTarget) {
      effRole = concurrentTarget;
      showToast("兼任考试：按" + ROLE_NAMES[concurrentTarget] + "要求组卷", "info");
    }
  }

  var isExtend = document.querySelector('input[name="examType"]:checked').value === "extend";
  var cfg = EXAM_CONFIG[effRole];
  if (!cfg) { showToast("未找到岗位考试配置", "error"); return; }

  var duration = isExtend ? 60 : (cfg.firstExam ? cfg.firstExam.duration : 90);
  state.taskId = 1;
  state.examType = isExtend ? "extend" : "first";
  state.remainingSec = duration * 60;

  var subjectLayout;
  if (isExtend) {
    subjectLayout = {"科目D": {"single":20, "multi":20, "judge":10}};
  } else {
    subjectLayout = cfg.firstExam ? cfg.firstExam.subjects : {"科目A":{"single":25,"multi":15,"judge":10},"科目B":{"single":5,"multi":5,"judge":5}};
  }

  var layout = [];
  for (var subj in subjectLayout) {
    var subjCfg = subjectLayout[subj];
    for (var qtype in subjCfg) {
      var need = subjCfg[qtype];
      if (need > 0) {
        var score = qtype === "single" ? 1 : 2;
        layout.push({subject: subj, type: qtype, need: need, score: score});
      }
    }
  }

  var picked = [];
  var unmet = [];
  layout.forEach(function(item) {
    var pool = questions.filter(function(q) { return q.role === item.subject && q.qtype === item.type; });
    if (pool.length < item.need) {
      pool = questions.filter(function(q) { return q.qtype === item.type; });
    }
    shuffleArray(pool);
    var count = Math.min(item.need, pool.length);
    for (var k = 0; k < count; k++) {
      var q = JSON.parse(JSON.stringify(pool[k]));
      q.score = item.score;
      picked.push(q);
    }
    if (count < item.need) {
      unmet.push(item.subject + " " + item.type + " 需" + item.need + "题，实际" + count + "题");
    }
  });

  shuffleArray(picked);
  var typeOrder = {single:1, multi:2, judge:3};
  picked.sort(function(a, b) { return (typeOrder[a.qtype]||99) - (typeOrder[b.qtype]||99); });

  if (picked.length < 5) {
    showToast("题库不足，仅" + picked.length + "题", "error");
    return;
  }
  if (unmet.length) showToast("题数不足：" + unmet.join("；"), "warn");

  state.questions = picked;
  state.answers = {};
  state.currentQ = 0;
  state.submitted = false;
  state.view = "exam";
  render();
  scrollTo(0, 0);
  showToast("考试开始，共 " + picked.length + " 题，时长 " + duration + "分钟，请独立完成", "info");
}

function renderExam() {

  let total = totalScore(state.questions);

  let answered = state.questions.filter(q => !!state.answers[q.id]).length;

  let pct = Math.round(answered / state.questions.length * 100);

  let typeLabel = {single:"单选题",multi:"多选题",judge:"判断题",short:"简答题",scenario:"场景分析题"};

  let typeColor = {single:"#1a5a9a",multi:"#6b3fa0",judge:"#1a8a4a",short:"#c05a20",scenario:"#8a1a4a"};

  let order = [];

  let groups = {};

  state.questions.forEach((q,i) => {

    let t = q.qtype || "other";

    if (!groups[t]) { groups[t] = []; order.push(t); }

    groups[t].push(i);

  });

  let navHtml = order.map((t, typeIdx) => {

    let idxs = groups[t];

    // 组内相对编号：1, 2, 3...

    let dots = idxs.map((i, idxInGroup) => {

      let cls = "q-dot";

      if (i === state.currentQ) cls += " current";

      else if (state.answers[state.questions[i].id]) cls += " answered";

      // 显示组内相对题号（从1开始）

      return `<div class="${cls}" data-idx="${i}" onclick="jumpTo(${i})">${idxInGroup + 1}</div>`;

    }).join("");

    let rangeTxt = idxs.length + "题";

    let lbl = typeLabel[t] || "其他";

    let col = typeColor[t] || "#1a3a6b";

    return `<div class="q-group">

      <div class="q-group-title"><span class="q-badge" style="background:${col}"></span>${lbl}<span class="q-group-range">${rangeTxt}</span></div>

      <div class="q-group-dots">${dots}</div>

    </div>`;

  }).join("");

  $("app").innerHTML = `

  <div class="page-exam">

    <div class="sidebar">

      <div class="card">

        <div class="sidebar-title">答题进度 <span style="font-weight:400;font-size:12px;color:var(--text-light)">共${state.questions.length}题</span></div>

        <div class="q-nav">${navHtml}</div>

        <div class="q-legend">

          <span><span class="dot" style="background:#eef2ff;border-color:var(--primary-light)"></span>未答</span>

          <span><span class="dot" style="background:#eef2ff;border-color:var(--primary-light)"></span>已答</span>

          <span><span class="dot" style="background:var(--accent);border-color:var(--accent)"></span>当前题</span>

        </div>

        <div class="timer-box">

          <div class="timer-label">⏱ 剩余时间</div>

          <div class="timer-num" id="timer">60:00</div>

        </div>

      </div>

    </div>

    <div class="exam-main">

      <div class="exam-header">

        <div>

          <h2>GB/T 18204 培训考核卷</h2>

          <div class="exam-info">

            <span>考生：<strong>${esc(state.candName)}</strong></span>

            <span>已答：<strong>${answered}/${state.questions.length}</strong></span>

            <span>满分：<strong>${total}</strong> 分</span>

          </div>

          <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>

        </div>

        <button class="btn btn-accent" onclick="confirmSubmit()">提交试卷</button>

      </div>

      <div class="question-card" id="q-card"></div>

      <div class="q-nav-bottom">

        <button class="btn btn-ghost" onclick="prevQ()">← 上一题</button>

        <button class="btn btn-primary" onclick="nextQ()">下一题 →</button>

        ${state.currentQ === state.questions.length - 1 ? `<button class="btn btn-accent" onclick="confirmSubmit()">提交试卷</button>` : ""}

        <button class="btn btn-ghost" onclick="backHome()">退出考试</button>

      </div>

    </div>

  </div>`;

  renderCurrentQ();

  startTimer();

}

function renderCurrentQ() {

  let q = state.questions[state.currentQ];

  let card = $("q-card");

  if (!card) return;

  let typeLabel = {single:"单选题",multi:"多选题",judge:"判断题",short:"简答题",scenario:"场景分析题"}[q.qtype]||"问答题";

  let typeColor = {single:"#1a5a9a",multi:"#6b3fa0",judge:"#1a8a4a",short:"#c05a20",scenario:"#8a1a4a"}[q.qtype]||"#1a3a6b";

  let optsHtml = "";

  if (q.qtype === "single" || q.qtype === "judge") {

    optsHtml = q.options.map(o => {

      let sel = (state.answers[q.id]||"") === o[0];

      let clr = sel ? typeColor : "";

      let bg = sel ? typeColor : "transparent";

      return `<div class="option-item${sel?" selected":""}" onclick="selectOption(this,'${o[0]}','${typeColor}')">

        <span class="opt-letter" style="color:${clr};border-color:${sel?typeColor:"currentColor"};background:${bg}">${o[0]}</span>

        <span class="opt-text">${esc(o.slice(2))}</span>

      </div>`;

    }).join("");

  } else if (q.qtype === "multi") {

    let selArr = (state.answers[q.id]||"").split(",").filter(x=>x);

    optsHtml = q.options.map(o => {

      let sel = selArr.includes(o[0]);

      let clr = sel ? "#fff" : "#6b3fa0";

      let bg = sel ? "#6b3fa0" : "transparent";

      return `<div class="option-item${sel?" selected":""}" onclick="toggleMulti(this,'${o[0]}')">

        <span class="opt-letter" style="color:${clr};border-color:${sel?"#6b3fa0":"currentColor"};background:${bg}">${o[0]}</span>

        <span class="opt-text">${esc(o.slice(2))}</span>

      </div>`;

    }).join("");

  } else {

    optsHtml = `<div class="short-area">

      <textarea id="short-answer" placeholder="请在此输入你的答案..." onchange="setShort(this.value)">${esc(state.answers[q.id]||"")}</textarea>

    </div>`;

  }

  card.innerHTML = `

    <span class="q-type" style="background:${typeColor}20;color:${typeColor}">${typeLabel} · ${q.score}分</span>

    <div class="q-stem">${esc(q.stem)}</div>

    <ul class="options">${optsHtml}</ul>

  `;

}

function selectOption(el, val, color) {

  let q = state.questions[state.currentQ];

  state.answers[q.id] = val;

  el.parentElement.querySelectorAll(".option-item").forEach(e => {

    e.classList.remove("selected");

    let l = e.querySelector(".opt-letter");

    l.style.background = "transparent"; l.style.color = ""; l.style.borderColor = "currentColor";

  });

  el.classList.add("selected");

  let l = el.querySelector(".opt-letter");

  l.style.background = color; l.style.color = "#fff"; l.style.borderColor = color;

  updateNav();

}

function toggleMulti(el, val) {

  let q = state.questions[state.currentQ];

  let arr = (state.answers[q.id]||"").split(",").filter(x=>x);

  if (arr.includes(val)) {

    arr = arr.filter(x=>x!==val);

    el.classList.remove("selected");

    let l = el.querySelector(".opt-letter");

    l.style.background = "transparent"; l.style.color = "#6b3fa0"; l.style.borderColor = "currentColor";

  } else {

    arr.push(val);

    el.classList.add("selected");

    let l = el.querySelector(".opt-letter");

    l.style.background = "#6b3fa0"; l.style.color = "#fff"; l.style.borderColor = "#6b3fa0";

  }

  state.answers[q.id] = arr.sort().join(",");

  updateNav();

}

function setShort(val) { state.answers[state.questions[state.currentQ].id] = val; updateNav(); }

function updateNav() {

  let nav = document.querySelector(".q-nav");

  if (!nav) return;

  state.questions.forEach((q,i) => {

    let dot = nav.querySelector('.q-dot[data-idx="'+i+'"]');

    if (!dot) return;

    dot.className = "q-dot";

    if (i===state.currentQ) dot.classList.add("current");

    else if (state.answers[q.id]) dot.classList.add("answered");

  });

  let answered = state.questions.filter(q=>!!state.answers[q.id]).length;

  let fill = document.querySelector(".progress-bar .fill");

  if (fill) fill.style.width = Math.round(answered/state.questions.length*100)+"%";

}

function jumpTo(idx) { state.currentQ=idx; renderCurrentQ(); updateNav(); }

function setResultFilter(f) {

  if (f!=='all' && state.resultFilter===f) f='all';

  state.resultFilter=f;

  let app=$("app");

  if(app) app.innerHTML=renderResult();

}

function prevQ() { if(state.currentQ>0){state.currentQ--;renderCurrentQ();updateNav()} }

function nextQ() { if(state.currentQ<state.questions.length-1){state.currentQ++;renderCurrentQ();updateNav()} }

function startTimer() {

  if(timerInterval) clearInterval(timerInterval);

  let sec = state.remainingSec || 90*60;

  timerInterval = setInterval(() => {

    sec--;

    if(sec<=0){clearInterval(timerInterval);confirmSubmit();return}

    let m=Math.floor(sec/60),s=sec%60;

    let el=document.getElementById("timer");

    if(el) el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

  }, 1000);

}

function confirmSubmit() {

  if(timerInterval){clearInterval(timerInterval);timerInterval=null}

  let unanswered=state.questions.filter(q=>!state.answers[q.id]).length;

  let html=`<div class="modal-overlay" onclick="closeModal(event)">

    <div class="modal-box" onclick="event.stopPropagation()">

      <button class="modal-close" onclick="reopenSubmitModal()">×</button>

      <h3>确认提交试卷？</h3>

      ${unanswered>0?`<p>你还有 <strong>${unanswered} 道题</strong>未作答，提交后将无法修改答案。</p>`:`<p>你已完成全部题目，确认提交吗？</p>`}

      <div class="modal-actions">

        <button class="btn btn-ghost" onclick="reopenSubmitModal()">继续答题</button>

        <button class="btn btn-accent" onclick="doSubmit()">确认提交 ✓</button>

      </div>

    </div>

  </div>`;

  document.body.insertAdjacentHTML("beforeend", html);

}

function reopenSubmitModal() {

  document.querySelector(".modal-overlay")?.remove();

  if(!timerInterval) startTimer();

}

function closeModal(e) {

  if(e&&e.target!==e.currentTarget) return;

  document.querySelector(".modal-overlay")?.remove();

  if(!timerInterval) startTimer();

}

function doSubmit() {

  document.querySelector(".modal-overlay")?.remove();

  let result = calcScore(state.questions, state.answers);

  state.score = result;

  state.passed = state.score >= 70;

  state.submitted = true;

  state.view = "result";

  saveRecord(state.score, state.passed);

  render();

  scrollTo(0,0);

}

// 主观题（简答/场景）按关键词覆盖率自动评分

function gradeSubjective(q, ua) {

  let ua2 = (ua||"").toLowerCase();

  let keys = (q.keyword||"").split(/[；;]/).map(k=>k.trim()).filter(Boolean);

  if (keys.length === 0) return { matched:0, total:0, ratio:0, score:0, auto:false };

  let matched = keys.filter(k => ua2.indexOf(k.toLowerCase()) >= 0).length;

  let ratio = matched / keys.length;

  let score = Math.round((q.score||0) * ratio);

  return { matched, total:keys.length, ratio, score, auto:true };

}

// 单题评判结果：返回 {isObj,isSubj,ok,g}

function questionResult(q, ua) {

  let isObj = ["single","multi","judge"].includes(q.qtype);

  let isSubj = q.qtype === "short" || q.qtype === "scenario";

  if (isObj) {

    let ok;

    if (q.qtype === "multi") ok = (ua||"").split(",").sort().join(",") === q.answer.split(",").sort().join(",");

    else ok = (ua||"") === q.answer;

    return { isObj, isSubj, ok, g:null };

  }

  if (isSubj) {

    let g = gradeSubjective(q, ua);

    return { isObj, isSubj, ok: g.total>0 && g.ratio>=0.5, g };

  }

  return { isObj, isSubj, ok:false, g:null };

}

function calcScore(qs, answers) {

  let auto=0;

  qs.forEach(q => {

    if(["single","judge"].includes(q.qtype)) {

      if((answers[q.id]||"")===q.answer) auto+=q.score;

    } else if(q.qtype==="multi") {

      let ca=q.answer.split(",").sort().join(",");

      if((answers[q.id]||"").split(",").sort().join(",")===ca) auto+=q.score;

    } else if(q.qtype==="short"||q.qtype==="scenario") {

      auto += gradeSubjective(q, answers[q.id]).score;

    }

  });

  return auto;

}

function backHome() {

  if(!confirm("确定退出？考试记录将丢失。")) return;

  if(timerInterval){clearInterval(timerInterval);timerInterval=null}

  state.view="home";

  render();

}

function saveRecord(score, passed) {

  let records = getRecords();

  records.push({

    time:new Date().toISOString(),

    name:state.candName,

    username:currentUser?.username||"",

    score, passed,

    answers: JSON.parse(JSON.stringify(state.answers)),

    questions: JSON.parse(JSON.stringify(state.questions))

  });

  saveRecords(records);

}

// ===== 结果页 =====

function renderResult() {

  let total=totalScore(state.questions);

  let rightCount=state.questions.filter(q=>{

    let r=questionResult(q, state.answers[q.id]);

    return r.ok;

  }).length;

  let subjCount=state.questions.filter(q=>q.qtype==="short"||q.qtype==="scenario").length;

  let subjScore=state.questions.filter(q=>q.qtype==="short"||q.qtype==="scenario").reduce((s,q)=>s+gradeSubjective(q, state.answers[q.id]).score, 0);

  let qList=state.questions.map((q,i)=>{

    let ua=state.answers[q.id]||"";

    let r=questionResult(q, ua);

    let tagCls, tagText, extraMeta="";

    if(r.isObj){

      tagCls=r.ok?"tag-right":"tag-wrong";

      tagText=r.ok?"✓ 正确":"✗ 错误";

    } else if(r.isSubj){

      if(r.g.total===0){ tagCls="tag-manual"; tagText="待人工阅卷"; }

      else { tagCls=r.ok?"tag-right":"tag-wrong"; tagText="自动评 "+r.g.score+"分"; extraMeta=`<span class="q-gr">关键词命中 ${r.g.matched}/${r.g.total}（覆盖率 ${Math.round(r.g.ratio*100)}%）</span>`; }

    } else { tagCls="tag-manual"; tagText="待人工阅卷"; }

    let cat=r.ok?"right":"wrong";

    if(r.isSubj) cat="subjective";

    if(state.resultFilter!=="all" && state.resultFilter!==cat) return "";

    return `<div class="q-list-item">

      <div class="q-list-stem">${i+1}. ${esc(q.stem)} <span class="tag ${tagCls}">${tagText}</span> <span class="tag" style="background:#f1f4f8;color:var(--text-light)">${q.score}分</span></div>

      <div class="q-list-meta">

        <span>你的答案：<strong>${esc(ua)||"未作答"}</strong></span>

        ${r.isObj?`<span>正确答案：<strong>${esc(q.answer)}</strong></span>`:""}

        ${extraMeta}

        ${q.explanation?`<span style="color:var(--primary-light)">${esc(q.explanation)}</span>`:""}

      </div>

    </div>`;

  }).filter(Boolean).join("");

  if(!qList) qList=`<p style="text-align:center;color:var(--text-light);font-size:13px;padding:24px">该分类下暂无题目</p>`;

  let certId="LV"+(+new Date()).toString(36).toUpperCase();

  let certDate=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"});

  return `<div class="page-result">

    <div class="result-hero">

      <div class="result-icon">${state.passed?"🏆":"📋"}</div>

      <h1>${state.passed?"恭喜！考试合格":"考试结束"}</h1>

      <div class="result-score">${state.score} <span style="font-size:22px;font-weight:400;opacity:.7">/ ${total} 分</span></div>

      <div class="result-sub">合格线 80 分 · ${state.passed?"合格":"不合格"} · ${esc(state.candName)} · GB/T 18204 培训考核卷</div>

    </div>

    <div class="cert-box">

      <div class="cert-title">湖南绿盾卫士检测技术有限公司</div>

      <div class="cert-company">培训考核合格证书</div>

      <div class="cert-line" style="border-top:1px dashed var(--border);margin:22px 0"></div>

      <div class="cert-name">${esc(state.candName)}</div>

      <div class="cert-score">${state.score} 分</div>

      <div class="cert-status ${state.passed?"pass":"fail"}">${state.passed?"✓ 合格":"✗ 不合格"}</div>

      <div class="cert-date">考核日期：${certDate}</div>

      <div class="cert-id">证书编号：${certId}</div>

    </div>

    <div class="result-detail">

let _selQ = new Set();

function _getFiltQ() {

  var role = document.getElementById("filter-role")?.value || "";

  var qtype = document.getElementById("filter-qtype")?.value || "";

  return questions.filter(function(q){

    if(role && q.role !== role) return false;

    if(qtype && q.qtype !== qtype) return false;

    return true;

  });

}

function toggleQSel(id) {

  if(_selQ.has(id)) _selQ.delete(id); else _selQ.add(id);

  refreshSelUI();

}

function toggleAllQ(checked) {

  var fq = _getFiltQ();

  if(checked){ fq.forEach(function(q){ _selQ.add(q.id); }); }

  else{ _selQ.clear(); }

  document.querySelectorAll('.cb-q').forEach(function(el){ el.checked = checked; });

  refreshSelUI();

}

function refreshSelUI() {

  var fq = _getFiltQ();

  var n = _selQ.size, tot = fq.length;

  var el = document.getElementById('sel-count');

  if(el) el.textContent = n > 0 ? '(' + n + ')' : '';

  var allCb = document.getElementById('cb-sel-all');

  if(allCb){ allCb.checked = n === tot && tot > 0; allCb.indeterminate = n > 0 && n < tot; }

}

function deleteSelectedQ() {

  if(_selQ.size === 0){ showToast('请先勾选要删除的题目','warn'); return; }

  if(!confirm('确定删除选中的 ' + _selQ.size + ' 道题目吗？此操作不可恢复！')) return;

  var ids = Array.from(_selQ);

  ids.forEach(function(id){ questions = questions.filter(function(q){ return q.id !== id; }); });

  saveQuestions(); _selQ.clear();

  showToast('已删除 ' + ids.length + ' 道题目','success');

  render();

}

  var roleStats = {};
  questions.forEach(function(q) {
    var r = q.role || "未分类";

  var typeStats = {};

function deleteUser(username) {
  if (!confirm('确定删除用户 "' + username + '" 吗？此操作不可恢复，该用户的考试记录将保留。')) return;
  var users = getUsers();
  users = users.filter(function(u) { return u.username !== username; });
  saveUsers(users);
  showToast('用户已删除', 'success');
  renderUsers();
}

function resetUserPassword(username) {
  if (!confirm('确定重置用户 "' + username + '" 的密码为 123456 吗？')) return;
  var users = getUsers();
  var u = users.find(function(u) { return u.username === username; });
  if (!u) { showToast('用户不存在', 'error'); return; }
  u.pwHash = hashPin('123456');
  saveUsers(users);
  showToast('密码已重置为 123456', 'success');
}

var _parsedQuestions = [];

function handleQuestionFile() {
  var fileInput = document.getElementById("upload-json-file");
  if (!fileInput || !fileInput.files[0]) { showToast("请先选择 JSON 文件", "error"); return; }
  var file = fileInput.files[0];
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      showUploadPreview(data);
    } catch(err) {
      showToast("JSON 解析失败：" + err.message, "error");
    }
  };
  reader.readAsText(file, "UTF-8");
}

function parsePastedQuestions() {
  var text = (document.getElementById("upload-json-text")||{}).value;
  if (text) text = text.trim();
  if (!text) { showToast("请先粘贴 JSON 文本", "error"); return; }
  try {
    var data = JSON.parse(text);
    showUploadPreview(data);
  } catch(err) {
    showToast("JSON 解析失败：" + err.message, "error");
  }
}

function showUploadPreview(data) {
  if (!Array.isArray(data)) { showToast("数据格式错误：应为题目数组", "error"); return; }

  _parsedQuestions = data.map(function(q, i) {
    return {
      id: q.id || (Date.now() + i),
      role: q.role || "未分类",
      qtype: q.qtype || "single",
      stem: q.stem || "",
      options: q.options || [],
      answer: q.answer || "",
      score: q.score || 1,
      analysis: q.analysis || ""
    };
  });

  var validCount = _parsedQuestions.filter(function(q) { return q.stem; }).length;
  var typeMap = {single:"单选题",multi:"多选题",judge:"判断题",short:"简答题",scenario:"场景分析题"};

  var html = '<div class="card" style="border:2px solid var(--accent)">';
  html += '<div class="card-title">解析结果预览</div>';
  html += '<div class="stat-row" style="margin-bottom:12px">';
  html += '<div class="stat-item"><div class="si-num">' + _parsedQuestions.length + '</div><div class="si-label">总题数</div></div>';
  html += '<div class="stat-item"><div class="si-num">' + validCount + '</div><div class="si-label">有效题目</div></div>';
  html += '</div>';

  var roleGroups = {};
  _parsedQuestions.forEach(function(q) {
    if (!roleGroups[q.role]) roleGroups[q.role] = 0;
    roleGroups[q.role]++;
  });
  html += '<div style="margin-bottom:12px;font-size:13px">';
  Object.keys(roleGroups).forEach(function(r) {
    html += '<span style="display:inline-block;margin:2px 6px;padding:4px 10px;border-radius:12px;background:var(--bg)">' + esc(r) + ': <strong>' + roleGroups[r] + '</strong>题</span>';
  });
  html += '</div>';

  html += '<div style="overflow-x:auto;max-height:300px;overflow-y:auto"><table class="q-table"><thead><tr><th>序号</th><th>岗位</th><th>题型</th><th>题目</th><th>分值</th></tr></thead><tbody>';
  _parsedQuestions.slice(0, 50).forEach(function(q, i) {
    html += '<tr><td>' + (i+1) + '</td>'
      + '<td><span style="background:#e8f4e8;color:#1a6b1a;font-size:11px;padding:2px 6px;border-radius:3px">' + esc(q.role) + '</span></td>'
      + '<td>' + (typeMap[q.qtype]||q.qtype) + '</td>'
      + '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(q.stem) + '</td>'
      + '<td style="text-align:center">' + q.score + '</td></tr>';
  });
  if (_parsedQuestions.length > 50) {
    html += '<tr><td colspan="5" style="text-align:center;color:var(--text-light);padding:8px">... 还有 ' + (_parsedQuestions.length - 50) + ' 道题未显示</td></tr>';
  }
  html += '</tbody></table></div>';
  html += '</div>';

  var el = document.getElementById("upload-preview");
  if (el) { el.innerHTML = html; el.style.display = "block"; }
  var btn = document.getElementById("btn-import");
  if (btn) btn.style.display = "inline-flex";
}

function importParsedQuestions() {
  if (_parsedQuestions.length === 0) { showToast("没有可导入的题目", "error"); return; }
  var valid = _parsedQuestions.filter(function(q) { return q.stem; });
  if (valid.length === 0) { showToast("没有有效题目可导入", "error"); return; }
  if (!confirm('确定导入 ' + valid.length + ' 道题目到题库吗？\n导入后将追加到现有题库末尾。')) return;

  var maxId = questions.reduce(function(m, q) { return Math.max(m, q.id || 0); }, 0);
  valid.forEach(function(q, i) { q.id = maxId + i + 1; questions.push(q); });
  saveQuestions();
  showToast('成功导入 ' + valid.length + ' 道题目！题库现有 ' + questions.length + ' 题', 'success');
  _parsedQuestions = [];
  showAdminTab('questions');
  render();
}

function importWordQuestions() {

  var fi = document.getElementById('word-questions-file');

  if (!fi || !fi.files.length) { showToast('请选择 WORD 文件', 'error'); return; }

  var file = fi.files[0];

  var ext = (file.name.split('.').pop() || '').toLowerCase();

  if (ext !== 'doc' && ext !== 'docx') { showToast('仅支持 .doc / .docx 文件', 'error'); return; }

  var btn = document.getElementById('word-import-btn');

  if (btn) { btn.disabled = true; btn.textContent = '解析中...'; }

  var reader = new FileReader();

  reader.onload = function(e) {

    var arrayBuffer = e.target.result;

    // Use mammoth.js to extract text from DOCX

    if (typeof mammoth === 'undefined') {

      showToast('正在加载文档解析库...', 'info');

      var script = document.createElement('script');

      script.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js';

      script.onload = function() { parseWordContent(arrayBuffer, file.name); };

      script.onerror = function() {

        showToast('文档解析库加载失败', 'error');

        if (btn) { btn.disabled = false; btn.textContent = '📥 导入题库'; }

      };

      document.head.appendChild(script);

    } else {

      parseWordContent(arrayBuffer, file.name);

    }

  };

  reader.readAsArrayBuffer(file);

}

function parseWordContent(arrayBuffer, fileName) {

  var btn = document.getElementById('word-import-btn');

  mammoth.extractRawText({ arrayBuffer: arrayBuffer }).then(function(result) {

    var text = result.value;

    var category = (document.getElementById('word-questions-category') || {value:''}).value.trim() || '未分类';

    var parsed = parseQuestionsFromText(text, category);

    if (!parsed.length) {

      showToast('未识别到有效题目，请检查文档格式', 'error');

      if (btn) { btn.disabled = false; btn.textContent = '📥 导入题库'; }

      return;

    }

    // Generate new IDs starting after existing questions

    var maxId = 0;

    for (var i = 0; i < questions.length; i++) { if (questions[i].id > maxId) maxId = questions[i].id; }

    for (var j = 0; j < parsed.length; j++) {

      parsed[j].id = ++maxId;

      questions.push(parsed[j]);

    }

    saveQuestions();

    showToast('成功导入 ' + parsed.length + ' 道题目', 'success');

    if (btn) { btn.disabled = false; btn.textContent = '📥 导入题库'; }

    render();

  }).catch(function(err) {

    showToast('文档解析失败: ' + err, 'error');

    if (btn) { btn.disabled = false; btn.textContent = '📥 导入题库'; }

  });

}

function parseQuestionsFromText(text, category, role) {

  var result = [];

  // Split by question number pattern: 1. 2. 3. etc

  var lines = text.split(/\r?\n/);

  var currentQ = null;

  var currentType = 'single';

  var currentStem = '';

  var currentOptions = [];

  var currentAnswer = '';

  for (var i = 0; i < lines.length; i++) {

    var line = lines[i].trim();

    if (!line) continue;

    // Detect question start: number followed by . or 、

    var qMatch = line.match(/^(\d+)[\.、．]\s*(.*)/);

    if (qMatch) {

      // Save previous question

      if (currentStem) {

        result.push(finalizeQuestion(currentStem, currentOptions, currentAnswer, category, category));

      }

      // Start new question

      currentStem = qMatch[2];

      currentOptions = [];

      currentAnswer = '';

      currentType = 'single';

      continue;

    }

    // Detect option line: A. B. C. D. or A、B、 etc

    var optMatch = line.match(/^([A-Da-d])[\.、．]\s*(.*)/);

    if (optMatch) {

      currentOptions.push(optMatch[1].toUpperCase() + '. ' + optMatch[2]);

      continue;

    }

    // Detect answer line

    var ansMatch = line.match(/^(?:答案|正确答案)[：:]*\s*(.*)/i);

    if (ansMatch) {

      var ans = ansMatch[1].trim();

      // Determine question type

      if (ans === '正确' || ans === '错误' || ans === '对' || ans === '错') {

        currentType = 'judge';

        currentAnswer = (ans === '正确' || ans === '对') ? '正确' : '错误';

        currentOptions = ['正确', '错误'];

      } else if (/^[A-Da-d]+$/.test(ans)) {

        // Multiple choice (single or multi)

        currentAnswer = ans.toUpperCase();

        if (currentAnswer.length > 1) currentType = 'multi';

      } else {

        // Short answer

        currentType = 'short';

        currentAnswer = ans;

        currentOptions = [];

      }

      continue;

    }

    // If no pattern matched and we have a stem, it's part of stem

    if (currentStem && !currentAnswer) {

      currentStem += ' ' + line;

    }

  }

  // Save last question

  if (currentStem) {

    result.push(finalizeQuestion(currentStem, currentOptions, currentAnswer, category, category));

  }

  return result;

}

function finalizeQuestion(stem, options, answer, category, role) {

  var type = 'single';

  if (!options || !options.length) {

    type = 'short';

  } else if (options.length === 2 && (options[0] === '正确' || options[0] === '错误')) {

    type = 'judge';

  } else if (answer && answer.length > 1) {

    type = 'multi';

  }

  return {

    qtype: type,

    stem: stem,

    options: options,

    answer: answer || '',

    keyword: '',

    explanation: '',

    score: type === 'short' ? 5 : 2,

    category: category || '',

    role: role || '其他'

  };

}

      { id:"l1", title:"第一章 公共场所卫生管理条例", content:"<h3>第一条</h3><p>本条例适用于下列公共场所：宾馆、饭馆、旅店、招待所、车马店、咖啡馆、酒吧、茶座；公共浴室、理发店、美容店；影剧院、录像厅（室）、游艺厅（室）、舞厅、音乐厅；体育场（馆）、游泳场（馆）、公园；展览馆、博物馆、美术馆、图书馆；商场（店）、书店；候诊室、候车（机、船）室、公共交通工具。</p><h3>第二条</h3><p>公共场所的下列项目应符合国家卫生标准和要求：空气、微小气候（湿度、温度、风速）；水质；采光、照明；噪音；顾客用具和卫生设施。</p><h3>第三条</h3><p>公共场所的卫生工作要求：环境整洁、空气清新微小气候（湿度、温度、风速）符合国家标准，水质符合国家生活饮用水卫生标准，采光、照明良好，噪音符合国家卫生标准，顾客用具和卫生设施清洁无污染。</p>" },

      { id:"l2", title:"第二章 公共场所卫生管理条例实施细则", content:"<h3>总则</h3><p>根据《公共场所卫生管理条例》制定本细则。公共场所经营者应当遵守有关卫生法律、行政法规和部门规章以及相关的卫生标准、规范。</p><h3>卫生管理</h3><p>公共场所经营者应当建立卫生管理制度，配备专职或兼职卫生管理人员，建立健全卫生管理档案。</p><h3>卫生许可证</h3><p>公共场所经营者应当依法取得县级以上卫生行政部门颁发的卫生许可证后方可向工商行政管理部门申请登记办理营业执照。</p>" },

      { id:"l3", title:"第三章 卫生监督与法律责任", content:"<h3>卫生监督机构</h3><p>县级以上地方人民政府卫生行政部门负责本行政区域的公共场所卫生监督管理工作。</p><h3>法律责任</h3><p>卫生质量不符合国家卫生标准和要求而继续营业的，未获得卫生许可证擅自营业的，拒绝卫生监督的，可根据情节轻重给予警告、罚款、停业整顿、吊销卫生许可证等行政处罚。</p><h3>处罚标准</h3><p>对违反本条例有关规定的单位或个人，可处以20元以上、5000元以下的罚款；情节较重的，处以5000元以上、20000元以下的罚款。</p>" },

      { id:"l4", title:"第四章 学校卫生工作条例", content:"<h3>学校卫生工作要求</h3><p>学校应当合理安排学生的学习时间。学校应当建立卫生制度，加强对学生个人卫生、环境卫生以及教室、宿舍卫生的管理。</p><h3>教室卫生要求</h3><p>学校教室的采光、照明、课桌椅配置等应当符合国家有关标准。教室墙壁和顶棚应当为白色或浅色。</p><h3>健康教育</h3><p>学校应当把健康教育纳入教学计划。普通中小学必须开设健康教育课，普通高等学校、中等专业学校、技工学校、农业中学、职业中学应当开设健康教育选修课或讲座。</p>" }

  expert: {

      { id:"e1", title:"第一章 教室环境卫生标准概述", content:"<h3>GB/T 18204 检测方法概览</h3><p>教室环境卫生检测主要包括：空气质量检测（二氧化碳、甲醛、PM2.5、PM10、细菌总数）；物理因素（温度、湿度、风速、噪声、照度、采光系数）。</p><h3>采样基本要求</h3><p>采样前关闭门窗30分钟以上，采样高度为呼吸带高度（1.2-1.5m）。采样点应避开通风口和门窗，均匀分布。</p><h3>检测频次</h3><p>学校教学环境每年至少检测一次，新装修或改建的教室投入使用前应进行专项检测。</p>" },

      { id:"e2", title:"第二章 教室采光照明检测", content:"<h3>采光系数</h3><p>采光系数 = 室内某一点照度 / 室外同一时间照度 × 100%，教室采光系数不应低于1.5%（GB 7793-2010）。</p><h3>桌面照度</h3><p>教室课桌面维持平均照度值不应低于300 lx，照度均匀度不应低于0.7。黑板面维持平均照度不应低于500 lx，均匀度不应低于0.8。</p><h3>照明检测方法</h3><p>使用照度计测量，测点布置在课桌面上，高度0.75m，测量前照度计应经过校准。</p>" },

      { id:"e3", title:"第三章 教室空气质量检测", content:"<h3>二氧化碳（CO₂）</h3><p>教室二氧化碳浓度不应超过0.15%（1500ppm）。使用不分光红外线气体分析仪法检测。</p><h3>甲醛（HCHO）</h3><p>教室甲醛浓度不应超过0.10mg/m³。使用酚试剂分光光度法检测。</p><h3>PM2.5/PM10</h3><p>教室PM2.5日均浓度不应超过75μg/m³，PM10日均不超过150μg/m³。使用重量法或光散射法检测。</p><h3>空气细菌总数</h3><p>教室空气细菌总数不应超过2500cfu/m³。使用撞击法或沉降法检测。</p>" },

      { id:"m2", title:"第二章 文件控制与记录管理", content:"<h3>文件控制</h3><p>所有文件发布前应由授权人员审查和批准。受控文件应有分发记录，作废文件应及时收回并标识。</p><h3>记录管理</h3><p>检测记录应包括原始观察、导出数据和最终结果。所有记录应清晰、完整，更改应可追溯，原记录不得涂改。</p><h3>保密性</h3><p>实验室应保护客户机密信息和所有权，对检测活动和结果的保密义务应在合同中明确。</p>" },

      { id:"m3", title:"第三章 内部审核与管理评审", content:"<h3>内部审核</h3><p>实验室应按照预定日程表和程序定期对其活动进行内部审核。审核员不得审核自己的工作。</p><h3>纠正措施</h3><p>发现不符合工作时，应采取纠正措施消除不符合原因。纠正措施应与问题的影响程度相适应。</p><h3>管理评审</h3><p>实验室最高管理者应定期对管理体系进行评审，确保其持续适宜性和有效性，评审记录应予保存。</p>" },

window.importRoleQuestions = function(rid) {

  var fi = document.getElementById("word-file-" + rid);

  if (!fi || !fi.files.length) { showToast("请选择 WORD 文件", "error"); return; }

  var file = fi.files[0];

  var ext = (file.name.split(".").pop() || "").toLowerCase();

  if (ext !== "doc" && ext !== "docx") { showToast("仅支持 .doc / .docx", "error"); return; }

  if (file.size > 60 * 1024 * 1024) { showToast("文件过大（不超过60MB）", "error"); return; }

  var roleName = window.ROLE_NAMES[rid] || rid;

  var btn = document.getElementById("word-btn-" + rid);

  if (btn) { btn.disabled = true; btn.textContent = "解析中..."; }

  var reader = new FileReader();

  reader.onload = function(e) {

    var arrayBuffer = e.target.result;

    if (typeof mammoth === "undefined") {

      var script = document.createElement("script");

      script.src = "https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js";

      script.onload = function() { doParseRoleWord(arrayBuffer, rid, roleName, btn); };

      script.onerror = function() { showToast("文档解析库加载失败", "error"); if (btn) { btn.disabled=false; btn.textContent = "&#128229; 导入"+roleName+"题库"; } };

      document.head.appendChild(script);

    } else {

      doParseRoleWord(arrayBuffer, rid, roleName, btn);

    }

  };

  reader.readAsArrayBuffer(file);

};

function doParseRoleWord(arrayBuffer, rid, roleName, btn) {

  mammoth.extractRawText({ arrayBuffer: arrayBuffer }).then(function(result) {

    var text = result.value;

    var parsed = parseQuestionsFromText(text, roleName);

    if (!parsed.length) {

      showToast("未识别到有效题目，请检查文档格式", "error");

      if (btn) { btn.disabled = false; btn.textContent = "&#128229; 导入"+roleName+"题库"; }

      return;

    }

    var maxId = 0;

    for (var i = 0; i < questions.length; i++) if (questions[i].id > maxId) maxId = questions[i].id;

    for (var j = 0; j < parsed.length; j++) {

      parsed[j].id = ++maxId;

      parsed[j].role = roleName;

      questions.push(parsed[j]);

    }

    saveQuestions();

    showToast("成功导入 " + parsed.length + " 道「" + roleName + "」题目", "success");

    if (btn) { btn.disabled = false; btn.textContent = "&#128229; 导入"+roleName+"题库"; }

    var fi = document.getElementById("word-file-" + rid);

    if (fi) fi.value = "";

    var cntEl = document.getElementById("rcount-" + rid);

    if (cntEl) cntEl.textContent = questions.filter(function(q){ return q.role === roleName; }).length;

    loadRoleList(rid, roleName);

    render();

  }).catch(function(err) {

    showToast("解析失败: " + err, "error");

    if (btn) { btn.disabled = false; btn.textContent = "&#128229; 导入"+roleName+"题库"; }

  });

}

window.doStartPractice = function(typeId) {

  var qs;

  if (typeId === 'all') qs = questions.slice();

  else qs = questions.filter(function(q){ return q.qtype === typeId; });

  qs = qs.map(function(q){ return {id: q.id, qtype: q.qtype, stem: q.stem, options: q.options, answer: q.answer, score: q.score, explanation: q.explanation||'', keyword: q.keyword||''}; });

  for (var i = qs.length - 1; i > 0; i--) {

    var j = Math.floor(Math.random() * (i + 1));

    var t = qs[i]; qs[i] = qs[j]; qs[j] = t;

  }

  state.pQuestions = qs;

  state.pAnswers = {};

  state.pIdx = 0;

  state.pDone = false;

  state.pResults = null;

  state.view = "practice-exam";

  render();

};

// 刷题考试页面

function renderPracticeExam() {

  var qs = state.pQuestions;

  if (!qs || !qs.length) { state.view = "practice"; render(); return; }

  var q = qs[state.pIdx];

  var num = state.pIdx + 1;

  var total = qs.length;

  var answered = state.pAnswers[q.id] !== undefined;

  var qtypeLabel = {single:"单选题", multi:"多选题", judge:"判断题", short:"简答题", scenario:"场景题"};

  var typeColors = {single:"type-single", multi:"type-multi", judge:"type-judge", short:"type-short", scenario:"type-scenario"};

      var sel = state.pAnswers[q.id] === oi;

      return '<div class="option-item' + (sel ? ' selected' : '') + '" onclick="pSelect(' + q.id + ',\'' + q.qtype + '\',' + oi + ')">'

        + '<span class="opt-letter">' + (q.qtype==='judge' ? (oi===0?'对':'错') : String.fromCharCode(65+oi)) + '</span>'

  } else if (q.qtype === 'multi') {

    var curAns = state.pAnswers[q.id] || [];

      return '<div class="option-item' + (sel ? ' selected' : '') + '" onclick="pToggleMulti(' + q.id + ',' + oi + ')">'

        + '<input type="checkbox"' + (sel ? ' checked' : '') + ' style="margin-right:8px" disabled>'

        + '<span class="opt-text">' + esc(o) + '</span></div>';

    }).join('');

  } else {

    optsHtml = '<div class="short-area"><textarea class="exam-textarea" placeholder="请输入答案..." id="p-textarea" oninput="pTextAns(' + q.id + ',this.value)">' + (typeof state.pAnswers[q.id]==='string' ? esc(state.pAnswers[q.id]) : '') + '</textarea></div>';

  }

  // 答题反馈

  var feedback = '';

  if (answered) {

    var correct = pCheckAns(q, state.pAnswers[q.id]);

    feedback = correct

      ? '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:14px;margin:12px 0;color:#1a8a4a;font-size:14px"><strong>✅ 回答正确！</strong></div>'

      : '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px;margin:12px 0;color:#c0392b;font-size:14px"><strong>❌ 回答错误</strong><div style="margin-top:4px">正确答案：' + esc(pGetCorrectStr(q)) + '</div></div>';

    if (q.explanation) {

      feedback += '<div style="background:#fff8e8;border:1px solid #e8d090;border-radius:8px;padding:14px;margin:12px 0;color:#7a5000;font-size:13px;line-height:1.6"><strong>📖 解析：</strong>' + esc(q.explanation) + '</div>';

    }

  }

  // 侧边栏题号

  var dots = qs.map(function(qq, i) {

    var ans = state.pAnswers[qq.id] !== undefined;

    var cur = i === state.pIdx ? ' current' : '';

    var done = ans ? ' answered' : '';

    return '<div class="q-dot' + cur + done + '" onclick="pGoto(' + i + ')">' + (i+1) + '</div>';

  }).join('');

  var answeredCount = Object.keys(state.pAnswers).length;

  var qTotal = state.questions.length;

  var pct = Math.round(answeredCount / qTotal * 100);

  return '<div class="page page-exam">'

    + '<div class="sidebar"><div class="card">'

    + '<div class="sidebar-title">刷题进度<span style="font-weight:400;font-size:12px;color:var(--text-light)"> 共' + qTotal + '题</span></div>'

    + '<div class="q-legend" style="margin-bottom:14px">'

    + '<span>已答 ' + answeredCount + '/' + qTotal + '</span>'

    + '<div class="progress-bar"><div class="fill" style="width:' + pct + '%"></div></div></div>'

    + '<div class="q-group-dots-practice">' + dots + '</div>'

    + '<div class="timer-box" style="margin-top:14px"><div class="timer-label">当前</div><div style="font-size:22px;font-weight:800;color:var(--primary)">' + num + '/' + qTotal + '</div></div>'

    + '</div></div>'

    + '<div class="exam-main">'

    + '<div class="question-card">'

    + '<span class="q-type ' + (typeColors[q.qtype] || '') + '">' + (qtypeLabel[q.qtype]||'未知') + '</span>'

    + '<span style="float:right;font-size:12px;color:var(--text-light)">第 ' + num + ' 题</span>'

    + '<div class="q-stem" style="margin-top:8px">' + esc(q.stem) + '</div>'

    + (q.qtype==='short'||q.qtype==='scenario' ? '' : '<div class="options">' + optsHtml + '</div>')

    + (q.qtype==='short'||q.qtype==='scenario' ? optsHtml : '')

    + '</div>'

    + '<div class="q-nav-bottom">'

    + (state.pIdx > 0 ? '<button class="btn btn-ghost" onclick="pPrev()">← 上一题</button>' : '')

    + (!answered ? '<button class="btn btn-primary" onclick="pSubmit()">提交答案</button>' : '')

    + (state.pIdx < total - 1 ? '<button class="btn btn-primary" onclick="pNext()">' + (answered ? '下一题 →' : '跳过') + '</button>' : '')

    + (answered && state.pIdx === total - 1 ? '<button class="btn btn-accent" onclick="pFinish()">📊 查看报告</button>' : '')

    + '</div></div></div>';

}

function pGetCorrectStr(q) {

  if (q.qtype === 'single') return String.fromCharCode(65 + parseInt(q.answer));

  if (q.qtype === 'judge') return q.answer;

  if (q.qtype === 'multi') return q.answer.split('').map(function(c){ return c.toUpperCase(); }).join('、');

  return q.answer;

}

function pCheckAns(q, ans) {

  if (q.qtype === 'single') return parseInt(ans) === parseInt(q.answer);

  if (q.qtype === 'judge') {

    var correctIdx = q.answer === '对' ? 0 : 1;

    return ans === correctIdx;

  }

  if (q.qtype === 'multi') {

    if (!Array.isArray(ans) || !q.answer) return false;

    var my = ans.slice().sort().join(',');

    var correct = q.answer.split('').map(function(c){ return c.toUpperCase(); }).sort().join(',');

    return my === correct;

  }

  if (q.qtype === 'short' || q.qtype === 'scenario') {

    if (typeof ans !== 'string' || !q.keyword) return false;

    var kws = q.keyword.split('；').filter(Boolean);

    var hits = kws.filter(function(k){ return ans.indexOf(k.trim()) >= 0; });

    return hits.length >= Math.ceil(kws.length * 0.5);

  }

  return false;

}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖南绿盾卫士检测技术有限公司 - 培训考核系统</title>
<style>
:root {
  --primary: #1a7a3c;
  --primary-dark: #0d5c27;
  --primary-light: #e8f5ec;
  --accent: #2ca01c;
  --bg: #f0f5f0;
  --white: #ffffff;
  --text: #1a1a1a;
  --text-light: #666;
  --border: #d4e8d8;
  --danger: #dc3545;
  --warn: #f0ad4e;
  --success: #28a745;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER ===== */
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  padding: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-icon {
  width: 40px; height: 40px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.logo-text h1 {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.2;
}
.logo-text span {
  font-size: 11px;
  opacity: 0.8;
}
.header-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
  text-decoration: none;
  white-space: nowrap;
}
.nav-btn:hover { background: rgba(255,255,255,0.25); }
.nav-btn.primary {
  background: rgba(255,255,255,0.9);
  color: var(--primary);
  border-color: transparent;
  font-weight: 600;
}
.nav-btn.primary:hover { background: white; }

/* ===== MAIN ===== */
.main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 32px 24px; }

/* ===== LOGIN PAGE ===== */
.login-page {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 64px);
}
.login-card {
  background: var(--white);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 48px 40px;
  width: 100%;
  max-width: 440px;
  border-top: 4px solid var(--primary);
}
.login-card h2 {
  text-align: center;
  color: var(--primary);
  font-size: 20px;
  margin-bottom: 8px;
}
.login-card p {
  text-align: center;
  color: var(--text-light);
  font-size: 13px;
  margin-bottom: 32px;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
.form-group input, .form-group select {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  transition: border-color 0.2s;
  outline: none;
  color: var(--text);
}
.form-group input:focus, .form-group select:focus {
  border-color: var(--primary);
}
.code-group {
  display: flex; gap: 10px;
}
.code-group input { flex: 1; }
.code-btn {
  padding: 10px 16px;
  background: var(--primary-light);
  color: var(--primary);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  transition: all 0.2s;
}
.code-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
.code-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  text-decoration: none;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline {
  background: transparent;
  color: var(--primary);
  border: 1.5px solid var(--primary);
}
.btn-outline:hover { background: var(--primary-light); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #c82333; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-block { width: 100%; }

.tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid var(--border); }
.tab-btn {
  padding: 10px 24px;
  border: none;
  background: transparent;
  font-size: 14px;
  cursor: pointer;
  color: var(--text-light);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

.login-footer {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--text-light);
}
.login-footer a { color: var(--primary); cursor: pointer; }
.login-footer a:hover { text-decoration: underline; }

/* ===== DASHBOARD ===== */
.dashboard { }
.welcome-banner {
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
  color: white;
  border-radius: 12px;
  padding: 32px 36px;
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}
.welcome-banner::after {
  content: '';
  position: absolute;
  right: -20px; top: -20px;
  width: 150px; height: 150px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.welcome-banner h2 { font-size: 22px; margin-bottom: 6px; }
.welcome-banner p { opacity: 0.85; font-size: 14px; }
.welcome-banner .stat-row {
  display: flex; gap: 32px; margin-top: 16px;
}
.stat-box {
  background: rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 12px 20px;
  text-align: center;
}
.stat-box .num { font-size: 24px; font-weight: 700; }
.stat-box .lab { font-size: 12px; opacity: 0.8; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 28px; }
.card {
  background: var(--white);
  border-radius: 10px;
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.12); border-color: var(--primary); }
.card-icon { font-size: 36px; margin-bottom: 12px; }
.card h3 { font-size: 16px; margin-bottom: 6px; color: var(--text); }
.card p { font-size: 13px; color: var(--text-light); }
.card .tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  margin-top: 10px;
  font-weight: 600;
}
.tag-green { background: #e8f5ec; color: var(--primary); }
.tag-blue { background: #e3f0fd; color: #1a6bc4; }
.tag-orange { background: #fff3e0; color: #e65100; }
.tag-red { background: #fde8ea; color: var(--danger); }

/* ===== EXAM PAGE ===== */
.exam-header {
  background: var(--white);
  border-radius: 10px;
  padding: 20px 28px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.exam-header h2 { font-size: 18px; color: var(--primary); }
.exam-timer {
  font-size: 18px;
  font-weight: 700;
  color: var(--danger);
  font-family: monospace;
}
.exam-progress { font-size: 13px; color: var(--text-light); }
.progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 6px; width: 200px; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s; }

.question-card {
  background: var(--white);
  border-radius: 10px;
  padding: 28px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.q-stem {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  line-height: 1.7;
}
.q-meta { display: flex; gap: 12px; margin-bottom: 16px; }
.q-badge {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
}
.q-badge.single { background: #e3f0fd; color: #1a6bc4; }
.q-badge.multi { background: #fff3e0; color: #e65100; }
.q-badge.judge { background: #e8f5ec; color: var(--primary); }
.q-badge.short { background: #f3e8ff; color: #7c3aed; }
.q-badge.scenario { background: #fde8ea; color: #b71c1c; }
.q-score { background: #f5f5f5; color: var(--text-light); font-size: 12px; }

.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 14px;
  line-height: 1.5;
}
.opt:hover { border-color: var(--primary); background: var(--primary-light); }
.opt.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); font-weight: 600; }
.opt input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
.opt.letter { font-weight: 700; min-width: 24px; color: var(--primary); }

textarea.short-answer {
  width: 100%;
  min-height: 120px;
  padding: 12px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  resize: vertical;
  outline: none;
  font-family: inherit;
}
textarea.short-answer:focus { border-color: var(--primary); }

.exam-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
}
.nav-btns { display: flex; gap: 10px; }

/* ===== ADMIN ===== */
.admin-layout { display: flex; gap: 20px; }
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--white);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 16px 0;
  height: fit-content;
}
.sidebar-item {
  padding: 12px 20px;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  transition: all 0.15s;
  border-left: 3px solid transparent;
}
.sidebar-item:hover { background: var(--primary-light); color: var(--primary); }
.sidebar-item.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }

.admin-content { flex: 1; min-width: 0; }
.admin-panel {
  background: var(--white);
  border-radius: 10px;
  padding: 24px;
  box-shadow: var(--shadow);
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--border);
}
.panel-header h2 { font-size: 18px; color: var(--primary); }
.panel-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.toolbar select, .toolbar input {
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  color: var(--text);
}
.toolbar select:focus, .toolbar input:focus { border-color: var(--primary); }
.toolbar label { font-size: 13px; color: var(--text-light); }
.toolbar select { cursor: pointer; }
.search-input { flex: 1; min-width: 200px; }

.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stats-row .stat-card {
  background: var(--primary-light);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  border: 1px solid var(--border);
}
.stats-row .stat-card .n { font-size: 28px; font-weight: 700; color: var(--primary); }
.stats-row .stat-card .l { font-size: 12px; color: var(--text-light); margin-top: 4px; }

table.q-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.q-table th {
  background: var(--primary-light);
  color: var(--primary-dark);
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
  white-space: nowrap;
}
table.q-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
table.q-table tr:hover td { background: #f8fdf8; }
table.q-table tr:last-child td { border-bottom: none; }
.stem-cell { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; border: none; transition: all 0.15s; }
.btn-sm-danger { background: #fde8ea; color: var(--danger); }
.btn-sm-danger:hover { background: var(--danger); color: white; }
.btn-sm-edit { background: var(--primary-light); color: var(--primary); }
.btn-sm-edit:hover { background: var(--primary); color: white; }
input.score-input { width: 60px; padding: 4px 8px; border: 1.5px solid var(--border); border-radius: 4px; font-size: 13px; text-align: center; }

.checkbox-cell { width: 36px; text-align: center; }
.table-check { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal {
  background: var(--white);
  border-radius: 12px;
  padding: 32px;
  max-width: 500px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
.modal h3 { font-size: 18px; margin-bottom: 20px; color: var(--primary); }
.modal-close {
  float: right;
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--text-light);
  line-height: 1;
}
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 24px;
  border-radius: 8px;
  color: white;
  font-size: 14px;
  z-index: 300;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  animation: slideUp 0.3s ease;
}
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-warn { background: var(--warn); color: #333; }
@keyframes slideUp {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* Upload area */
.upload-area {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin: 12px 0;
}
.upload-area:hover { border-color: var(--primary); background: var(--primary-light); }
.upload-area .icon { font-size: 40px; margin-bottom: 10px; }
.upload-area p { font-size: 14px; color: var(--text-light); }
.upload-area small { font-size: 12px; }

/* Records */
.record-item {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.record-item:hover { border-color: var(--primary); background: var(--primary-light); }
.record-left .name { font-weight: 600; font-size: 15px; }
.record-left .meta { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.record-score { font-size: 28px; font-weight: 700; }
.record-pass { color: var(--success); }
.record-fail { color: var(--danger); }

/* Score display */
.score-page {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 64px);
}
.score-card {
  background: var(--white);
  border-radius: 16px;
  padding: 48px;
  text-align: center;
  box-shadow: var(--shadow);
  max-width: 480px;
  width: 100%;
  border-top: 5px solid var(--primary);
}
.score-num { font-size: 72px; font-weight: 800; color: var(--primary); }
.score-label { font-size: 18px; color: var(--text-light); margin-bottom: 8px; }
.score-result { font-size: 22px; font-weight: 700; margin: 16px 0; }
.score-result.pass { color: var(--success); }
.score-result.fail { color: var(--danger); }
.score-detail { font-size: 14px; color: var(--text-light); margin-bottom: 24px; }

/* Print */
@media print {
  .header, .nav-btns, .btn, .exam-actions { display: none !important; }
  .question-card { box-shadow: none; border: 1px solid #ccc; }
  body { background: white; }
  .score-card { box-shadow: none; border: 1px solid #ccc; }
}

/* ===== PIN Login (Admin) ===== */
.pin-modal {
  background: var(--white);
  border-radius: 16px;
  padding: 40px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
.pin-dots { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--primary); background: transparent; transition: all 0.15s; }
.pin-dot.filled { background: var(--primary); }
.pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 240px; margin: 0 auto; }
.pin-key { padding: 14px; font-size: 22px; background: var(--primary-light); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.15s; font-weight: 600; color: var(--text); }
.pin-key:hover { background: var(--primary); color: white; border-color: var(--primary); }
.pin-key.del { font-size: 16px; }

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* Confirm dialog */
.confirm-box { text-align: center; }
.confirm-box p { font-size: 15px; margin: 20px 0; color: var(--text); }

/* Role tabs */
.role-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.role-tab {
  padding: 5px 12px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  background: transparent;
  color: var(--text-light);
  transition: all 0.15s;
}
.role-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
.role-tab:hover { border-color: var(--primary); color: var(--primary); }

/* Pagination */
.pagination { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 20px; }
.page-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px; background: white; cursor: pointer; font-size: 13px; }
.page-btn:hover { border-color: var(--primary); color: var(--primary); }
.page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

/* Responsive */
@media (max-width: 768px) {
  .admin-layout { flex-direction: column; }
  .sidebar { width: 100%; }
  .header-inner { padding: 0 12px; }
  .logo-text h1 { font-size: 13px; }
  .main { padding: 16px 12px; }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header" id="header" style="display:none">
  <div class="header-inner">
    <div class="logo-area">
      <div class="logo-icon">🛡️</div>
      <div class="logo-text">
        <h1>湖南绿盾卫士检测技术有限公司</h1>
        <span>培训考核系统</span>
      </div>
    </div>
    <nav class="header-nav" id="headerNav">
      <!-- dynamic -->
    </nav>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main class="main" id="mainContent">
  <!-- dynamic -->
</main>

<script>
// ===== STORAGE KEYS =====
const Q_KEY = 'lvudun_questions_v2';
const USERS_KEY = 'lvudun_users_v2';
const RECS_KEY = 'lvudun_records_v2';
const ADMIN_PIN = '888888';
const PASS_SCORE = 60;
const PAGE_SIZE = 20;

// ===== STATE =====
let state = {
  view: 'login',   // login | userHome | exam | result | admin
  adminTab: 'dashboard',
  user: null,
  isAdmin: false,
  questions: [],
  exam: null,
  selectedRole: 'all',
  selectedQtype: 'all',
  searchKw: '',
  page: 1,

function typeName(t) {

// ===== PARSE EXCEL =====
function parseExcel(raw) {
  // raw: array of arrays, first row = headers
  // Expected headers: 题型, 题目, 选项A, 选项B, 选项C, 选项D, 正确答案, 解析(可选), 分值(可选), 分类(可选)
  // "正确答案" format: "A" or "AB" or "正确/错误" or text answer
  const [headers, ...rows] = raw;
  const h = headers.map(h => String(h).trim());
  const get = (row, name) => {
    const idx = h.indexOf(name);
    return idx >= 0 ? String(row[idx] || '').trim() : '';
  };

  const typeMap = {
    '单选': 'single', '单选题': 'single',
    '多选': 'multi', '多选题': 'multi',
    '判断': 'judge', '判断题': 'judge',
    '简答': 'short', '简答题': 'short',
    '案例': 'scenario', '场景': 'scenario', '场景题': 'scenario'
  };

  const parseAns = (ans) => {
    if (!ans) return '';
    const a = String(ans).trim();
    if (['正确','对','true','T','YES','Y','√','1','对√'].includes(a)) return 'T';
    if (['错误','错','false','F','NO','N','×','0','错×'].includes(a)) return 'F';
    return a.toUpperCase().replace(/[^A-D]/g,'').split('').sort().join('');
  };

  let id = Date.now();
  const qs = [];
  for (const row of rows) {
    if (!row || row.length < 2) continue;
    const t = typeMap[get(row,'题型')] || 'single';
    const stem = get(row,'题目') || get(row,'题干') || '';
    if (!stem) continue;

    const q = { id: id++, qtype: t, stem, options: [], answer: '', analysis: '', score: 5, role: get(row,'分类') || get(row,'岗位') || '其他' };

    if (t === 'single' || t === 'multi') {
      for (const opt of ['A','B','C','D','E','F']) {
        const label = get(row,'选项'+opt) || get(row, opt) || '';
        if (label) q.options.push({ label: opt, text: label });
      }
      q.answer = parseAns(get(row,'正确答案'));
    } else if (t === 'judge') {
      q.options = [{label:'T',text:'正确'},{label:'F',text:'错误'}];
      q.answer = parseAns(get(row,'正确答案'));
    } else {
      q.answer = get(row,'正确答案') || '';
    }

    const score = parseFloat(get(row,'分值') || '5');
    if (!isNaN(score)) q.score = score;

    q.analysis = get(row,'解析') || '';
    qs.push(q);
  }
  return qs;
}

// ===== IMPORT XLSX (browser) =====
async function importExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        // UseSheetJS from CDN if available, else simple CSV fallback
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(data, {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(ws, {header:1});
          resolve(parseExcel(raw));
        } else {
          // Try to parse as CSV
          const text = new TextDecoder().decode(data);
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          const rows = lines.map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g,'')));
          resolve(parseExcel(rows));
        }
      } catch(err) {
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

// ===== EXPORT XLSX (browser) =====
function exportExcel() {
  if (typeof XLSX === 'undefined') {
    // CSV fallback
    const headers = ['题型','题目','选项A','选项B','选项C','选项D','正确答案','解析','分值','分类'];
    const rows = state.questions.map(q => {
      const opts = {};
      (q.options||[]).forEach(o => opts[o.label] = o.text);
      return [
        typeName(q.qtype), q.stem,
        opts['A']||'', opts['B']||'', opts['C']||'', opts['D']||'',
        q.answer||'', q.analysis||'',
        q.score||5, q.role||''
      ];
    });
    const csv = [headers, ...rows].map(r => r.map(c => `"${c}"`).join(',')).join('\n');
    downloadFile('\uFEFF'+csv, '题库导出.csv', 'text/csv;charset=utf-8');
    showToast('题库已导出为 CSV', 'success');
    return;
  }
  const data = state.questions.map(q => {
    const opts = {};
    (q.options||[]).forEach(o => opts[o.label] = o.text);
    return {
      '题型': typeName(q.qtype),
      '题目': q.stem,
      '选项A': opts['A']||'',
      '选项B': opts['B']||'',
      '选项C': opts['C']||'',
      '选项D': opts['D']||'',
      '正确答案': q.answer||'',
      '解析': q.analysis||'',
      '分值': q.score||5,
      '分类': q.role||''
    };
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(data);
  XLSX.utils.book_append_sheet(wb, ws, '题库');
  XLSX.writeFile(wb, '题库导出.xlsx');
  showToast('题库已导出为 Excel', 'success');
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

          const isAns = o.label === a.yourAnswer;
          const isRight = o.label === a.correctAnswer;
          let cls = 'opt';

        }).join('') : ''}
        ${a.qtype !== 'single' && a.qtype !== 'multi' && a.qtype !== 'judge' ? `<div style="margin-top:8px;font-size:13px"><strong>你的答案：</strong>${esc(a.yourAnswer||'（未作答）')}</div>` : ''}

// ===== EXAM =====
function renderExam() {
  const ex = state.exam;
  if (!ex || ex.done) { state.view='result'; render(); return; }
  const q = ex.questions[ex.currentIdx];
  const total = ex.questions.length;
  const answered = Object.keys(ex.answers).length;
  const pct = Math.round(answered / total * 100);

  return `
<div>
  <div class="exam-header">
    <div>
      <h2>📝 培训考核</h2>
      <div class="exam-progress">已答 ${answered}/${total} 题 &nbsp;·&nbsp; ${pct}%</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div style="text-align:right">
      <div class="exam-timer" id="timer">--:--</div>
      <div style="font-size:12px;color:var(--text-light)">考试计时</div>
    </div>
  </div>

  <div class="question-card">
    <div class="q-meta">
      <span class="q-badge ${q.qtype}">${typeName(q.qtype)}</span>
      <span class="q-score">${q.score||5}分</span>
      <span style="font-size:12px;color:var(--text-light)">第 ${ex.currentIdx+1}/${total} 题</span>
    </div>
    <div class="q-stem">${esc(q.stem)}</div>
    ${renderOptions(q)}
    ${q.qtype === 'short' || q.qtype === 'scenario' ? `
      <textarea class="short-answer" id="shortAns" placeholder="请输入您的答案" oninput="saveShortAns()">${esc(ex.answers[q.id]||'')}</textarea>` : ''}
  </div>

  <div class="exam-actions">
    <div class="nav-btns">
      ${ex.currentIdx > 0 ? `<button class="btn btn-outline" onclick="prevQ()">⬅ 上一题</button>` : ''}
      ${ex.currentIdx < total - 1 ? `<button class="btn btn-primary" onclick="nextQ()">下一题 ➡</button>` : `<button class="btn btn-primary" style="background:var(--success)" onclick="submitExam()">📮 交卷</button>`}
    </div>
    <div class="q-nav-dots" style="display:flex;gap:4px;flex-wrap:wrap;max-width:400px">
      ${ex.questions.map((qq,i) => {
        const done = ex.answers[qq.id] !== undefined;
        const cur = i === ex.currentIdx;
        return `<div onclick="gotoQ(${i})" style="width:24px;height:24px;border-radius:4px;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid ${cur?'var(--primary)':done?'var(--success)':'#ddd'};background:${cur?'var(--primary-light)':done?'#e8f5ec':'white'};color:${cur?'var(--primary)':done?'var(--success)':'#999'};font-weight:${cur?'700':'400'}">${i+1}</div>`;
      }).join('')}
    </div>
  </div>
</div>`;
}

function renderOptions(q) {
  if (q.qtype === 'short' || q.qtype === 'scenario') return '';
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const answered = state.exam.answers[q.id];
  const isMulti = q.qtype === 'multi';
  const inputType = isMulti ? 'checkbox' : 'radio';
  const name = 'q_' + q.id;
  const sel = answered ? (Array.isArray(answered) ? answered : [answered]) : [];

  if (q.qtype === 'judge') {
    return `<div class="options">
      ${[{label:'T',text:'正确'},{label:'F',text:'错误'}].map(o => `
        <label class="opt ${sel.includes(o.label) ? 'selected' : ''}" onclick="selectOpt('${q.id}','${o.label}',${isMulti})">
          <input type="${inputType}" name="${name}" value="${o.label}" ${sel.includes(o.label) ? 'checked' : ''} onchange="selectOpt('${q.id}','${o.label}',${isMulti})">
          <span class="opt letter">${o.label === 'T' ? '√' : '×'}</span>
          <span>${esc(o.text)}</span>
        </label>`).join('')}
    </div>`;
  }

  return `<div class="options">
    ${(q.options||[]).map((o,i) => `
      <label class="opt ${sel.includes(o.label) ? 'selected' : ''}" onclick="selectOpt('${q.id}','${o.label}',${isMulti})">
        <input type="${inputType}" name="${name}" value="${o.label}" ${sel.includes(o.label) ? 'checked' : ''} onchange="selectOpt('${q.id}','${o.label}',${isMulti})">
        <span class="opt letter">${letters[i]||o.label}</span>
        <span>${esc(o.text)}</span>
      </label>`).join('')}
  </div>`;
}

function selectOpt(qId, val, isMulti) {
  if (isMulti) {
    if (!state.exam.answers[qId]) state.exam.answers[qId] = [];
    const arr = state.exam.answers[qId];
    const idx = arr.indexOf(val);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(val);
    if (arr.length === 0) delete state.exam.answers[qId];
  } else {
    state.exam.answers[qId] = val;
  }
}

function saveShortAns() {
  const v = document.getElementById('shortAns').value;
  const q = state.exam.questions[state.exam.currentIdx];
  if (v.trim()) state.exam.answers[q.id] = v;
  else delete state.exam.answers[q.id];
}

function nextQ() {
  if (state.exam.currentIdx < state.exam.questions.length - 1) {
    state.exam.currentIdx++;
    render();
  }
}
function prevQ() {
  if (state.exam.currentIdx > 0) {
    state.exam.currentIdx--;
    render();
  }
}
function gotoQ(idx) {
  state.exam.currentIdx = idx;
  render();
}

function submitExam() {
  const ex = state.exam;
  const unanswered = ex.questions.filter(q => ex.answers[q.id] === undefined).length;
  if (unanswered > 0 && !confirm(`还有 ${unanswered} 道题未作答，确认交卷？`)) return;

  // Score
  let totalScore = 0;
  const recAnswers = [];
  ex.questions.forEach(q => {
    const yourAnswer = ex.answers[q.id];
    let correct = false;
    let score = 0;
    const ans = String(q.answer||'').toUpperCase().trim();

    if (q.qtype === 'single' || q.qtype === 'judge') {
      const ya = Array.isArray(yourAnswer) ? yourAnswer[0] : yourAnswer;
      correct = ya === ans;
      score = correct ? (q.score||5) : 0;
    } else if (q.qtype === 'multi') {
      const ya = Array.isArray(yourAnswer) ? yourAnswer.sort().join('') : yourAnswer||'';
      correct = ya === ans;
      score = correct ? (q.score||5) : 0;
    } else {
      // Short/Scenario: keyword match
      if (yourAnswer && ans) {
        const kwCount = ans.split(/[,，;；]/).filter(k=>k.trim()).length;
        const matchCount = ans.split(/[,，;；]/).filter(k=>k.trim() && yourAnswer.includes(k.trim())).length;
        score = Math.round((matchCount / Math.max(kwCount,1)) * (q.score||5));
        correct = matchCount >= Math.ceil(kwCount * 0.5);
      }
      score = score || 0;
    }

    totalScore += score;
    recAnswers.push({
      id: q.id, qtype: q.qtype, stem: q.stem,
      yourAnswer: Array.isArray(yourAnswer) ? yourAnswer.join('') : (yourAnswer||''),
      correctAnswer: q.answer||'',
      score: q.score||5, correct, analysis: q.analysis||'',
      options: q.options||[]
    });
  });

  // Normalize to 100
  const finalScore = Math.round(totalScore / ex.totalScore * 100);
  const timeCost = Math.round((Date.now() - ex.startTime) / 1000);
  const now = new Date();
  const dateStr = now.toLocaleDateString('zh-CN');
  const timeStr = now.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});

  const rec = {
    id: Date.now(), userId: state.user?.id, userName: state.user?.name,
    date: dateStr, time: timeStr,
    score: finalScore, count: ex.questions.length,
    timeCost, answers: recAnswers,
    passed: finalScore >= PASS_SCORE
  };
  const recs = loadRecs();
  recs.push(rec);
  saveRecs(recs);

  state.exam.done = true;
  state.exam.score = finalScore;
  state.view = 'result';
  render();
}

function renderResult() {
  const ex = state.exam;
  const score = ex?.score || 0;
  const passed = score >= PASS_SCORE;
  return `
<div class="score-page">
  <div class="score-card">
    <div style="font-size:48px;margin-bottom:8px">${passed ? '🎉' : '😢'}</div>

    <div class="record-item" onclick="viewRecordAdmin(${r.id})">
      <div class="record-left">
        <div class="name">${esc(r.userName||'用户')} &nbsp;·&nbsp; ${r.date} ${r.time}</div>
        <div class="meta">${r.count}题 · 用时${r.timeCost}秒</div>
      </div>
      <div class="record-score ${r.score >= PASS_SCORE ? 'record-pass' : 'record-fail'}">${r.score}分</div>
    </div>`).join('') : '<div class="empty-state"><div class="icon">📋</div><p>暂无考试记录</p></div>'}
  ${totalPages > 1 ? `<div class="pagination">
    <button class="page-btn" onclick="state.page=Math.max(1,state.page-1);render()">‹</button>
    ${Array.from({length:Math.min(5,totalPages)},(_,i)=>{const p=Math.max(1,Math.min(totalPages-4,state.page-2))+i;return p<=totalPages?`<button class="page-btn ${p===page?'active':''}" onclick="state.page=${p};render()">${p}</button>`:'';}).join('')}
    <button class="page-btn" onclick="state.page=Math.min(${totalPages},state.page+1);render()">›</button>
  </div>` : ''}
</div>`;
}

function viewRecordAdmin(id) {
  viewRecord(id);
}

function renderAdminUsers() {
  const users = loadUsers();
  const recs = loadRecs();
  return `
<div class="admin-panel">
  <div class="panel-header">
    <h2>👥 用户管理 &nbsp;<span style="font-size:13px;color:var(--text-light);font-weight:400">共 ${users.length} 人</span></h2>
  </div>
  <div style="overflow-x:auto">
    <table class="q-table">
      <thead><tr><th>姓名</th><th>手机号</th><th>注册时间</th><th>考试次数</th><th>最高分</th><th>操作</th></tr></thead>
      <tbody>
        ${users.map(u => {
          const urs = recs.filter(r => r.userId === u.id);
          const maxScore = urs.length ? Math.max(...urs.map(r=>r.score)) : '—';
          return `<tr>
            <td>${esc(u.name)}</td>
            <td>${esc(u.phone)}</td>
            <td style="font-size:12px">${esc(u.created)}</td>
            <td>${urs.length}次</td>
            <td style="font-weight:700;color:${maxScore==='—'?'inherit':(maxScore>=PASS_SCORE?'var(--success)':'var(--danger)')}">${maxScore}</td>
            <td><button class="btn-sm btn-sm-danger" onclick="deleteUser(${u.id})">删除</button></td>
          </tr>`;
        }).join('') || '<tr><td colspan="6"><div class="empty-state"><p>暂无用户</p></div></td></tr>'}
      </tbody>
    </table>
  </div>
</div>`;
}

// ===== QUESTION CRUD =====
function showAddQuestion() {
  openModal('添加题目', `
    <div class="form-group"><label>题型</label>
      <select id="eqType">
        <option value="single">单选题</option><option value="multi">多选题</option>
        <option value="judge">判断题</option><option value="short">简答题</option>
        <option value="scenario">案例分析题</option>
      </select>
    </div>
    <div class="form-group"><label>题目</label><textarea id="eqStem" rows="3" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;resize:vertical;font-family:inherit" placeholder="请输入题目内容"></textarea></div>
    <div id="eqOpts">
      <div class="form-group"><label>选项 A</label><input id="eqA" placeholder="选项A内容"></div>
      <div class="form-group"><label>选项 B</label><input id="eqB" placeholder="选项B内容"></div>
      <div class="form-group"><label>选项 C</label><input id="eqC" placeholder="选项C内容（可不填）"></div>
      <div class="form-group"><label>选项 D</label><input id="eqD" placeholder="选项D内容（可不填）"></div>
    </div>
    <div class="form-group"><label>正确答案</label><input id="eqAns" placeholder="如：A 或 AB 或 T"></div>
    <div class="form-group"><label>分值</label><input id="eqScore" type="number" value="5" min="1" max="100"></div>
    <div class="form-group"><label>分类</label><input id="eqRole" placeholder="如：法规、专业、其他（可不填）"></div>
    <div class="form-group"><label>解析</label><textarea id="eqAnalysis" rows="2" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;resize:vertical;font-family:inherit" placeholder="可不填"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="doAddQuestion()">保存</button>
    </div>`);
}

function doAddQuestion() {
  const qtype = document.getElementById('eqType').value;
  const stem = document.getElementById('eqStem').value.trim();
  if (!stem) { showToast('请输入题目', 'warn'); return; }
  const q = { id: Date.now(), qtype, stem, score: parseInt(document.getElementById('eqScore').value)||5, answer: document.getElementById('eqAns').value.trim(), analysis: document.getElementById('eqAnalysis').value.trim(), role: document.getElementById('eqRole').value.trim()||'其他', options: [] };
  if (qtype === 'single' || qtype === 'multi') {
    const a = document.getElementById('eqA').value.trim();
    const b = document.getElementById('eqB').value.trim();
    if (!a || !b) { showToast('至少填写A和B选项', 'warn'); return; }
    if (a) q.options.push({label:'A',text:a});
    if (b) q.options.push({label:'B',text:b});
    if (document.getElementById('eqC').value.trim()) q.options.push({label:'C',text:document.getElementById('eqC').value.trim()});
    if (document.getElementById('eqD').value.trim()) q.options.push({label:'D',text:document.getElementById('eqD').value.trim()});
  } else if (qtype === 'judge') {
    q.options = [{label:'T',text:'正确'},{label:'F',text:'错误'}];
  }
  loadQ();
  state.questions.push(q);
  saveQ();
  closeModal();
  showToast('题目已添加', 'success');
  if (state.adminTab === 'questions') render();
}

function editQuestion(id) {
  loadQ();
  const q = state.questions.find(x => x.id === id);
  if (!q) return;
  openModal('编辑题目', `
    <div class="form-group"><label>题型</label><select id="eqType2"><option value="single" ${q.qtype==='single'?'selected':''}>单选题</option><option value="multi" ${q.qtype==='multi'?'selected':''}>多选题</option><option value="judge" ${q.qtype==='judge'?'selected':''}>判断题</option><option value="short" ${q.qtype==='short'?'selected':''}>简答题</option><option value="scenario" ${q.qtype==='scenario'?'selected':''}>案例题</option></select></div>
    <div class="form-group"><label>题目</label><textarea id="eqStem2" rows="3" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;resize:vertical;font-family:inherit">${esc(q.stem)}</textarea></div>
    <div id="eqOpts2">
      ${(q.options||[]).map((o,i) => `<div class="form-group"><label>选项 ${o.label}</label><input id="eqOpt${o.label}" value="${esc(o.text)}"></div>`).join('')}
    </div>
    <div class="form-group"><label>正确答案</label><input id="eqAns2" value="${esc(q.answer||'')}"></div>
    <div class="form-group"><label>分值</label><input id="eqScore2" type="number" value="${q.score||5}" min="1"></div>
    <div class="form-group"><label>分类</label><input id="eqRole2" value="${esc(q.role||'')}"></div>
    <div class="form-group"><label>解析</label><textarea id="eqAnalysis2" rows="2" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;resize:vertical;font-family:inherit">${esc(q.analysis||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="doSaveQuestion(${id})">保存</button>
    </div>`);
}

function doSaveQuestion(id) {
  loadQ();
  const idx = state.questions.findIndex(x => x.id === id);
  if (idx < 0) return;
  const qtype = document.getElementById('eqType2').value;
  const stem = document.getElementById('eqStem2').value.trim();
  if (!stem) { showToast('题目不能为空', 'warn'); return; }
  const opts = [];
  if (qtype === 'single' || qtype === 'multi') {
    for (const l of ['A','B','C','D','E']) {
      const v = document.getElementById('eqOpt'+l)?.value?.trim();
      if (v) opts.push({label:l,text:v});
    }
  } else if (qtype === 'judge') {
    opts.push({label:'T',text:'正确'},{label:'F',text:'错误'});
  }
  state.questions[idx] = {
    ...state.questions[idx],
    qtype, stem,
    options: opts,
    answer: document.getElementById('eqAns2').value.trim(),
    score: parseInt(document.getElementById('eqScore2').value)||5,
    role: document.getElementById('eqRole2').value.trim()||'其他',
    analysis: document.getElementById('eqAnalysis2').value.trim()
  };
  saveQ();
  closeModal();
  showToast('题目已保存', 'success');
  render();
}

function deleteQ(id) {
  if (!confirm('确定删除该题目？')) return;
  loadQ();
  state.questions = state.questions.filter(q => q.id !== id);
  saveQ();
  showToast('已删除', 'success');
  render();
}

function setQScore(id, val) {
  loadQ();
  const q = state.questions.find(x => x.id === id);
  if (q) { q.score = parseInt(val)||5; saveQ(); }
}

// ===== BATCH OPERATIONS =====
function toggleQSel(id) {
  if (state.batchSel.has(id)) state.batchSel.delete(id);
  else state.batchSel.add(id);
  updateBatchUI();
}
function toggleAllQuestions(checked) {
  loadQ();
  const kw = state.searchKw.toLowerCase();
  const filtered = state.questions.filter(q => {
    if (state.selectedRole !== 'all' && q.role !== state.selectedRole) return false;
    if (state.selectedQtype !== 'all' && q.qtype !== state.selectedQtype) return false;
    if (kw && !q.stem.toLowerCase().includes(kw)) return false;
    return true;
  });
  if (checked) filtered.forEach(q => state.batchSel.add(q.id));
  else state.batchSel.clear();
  updateBatchUI();
  // Update checkboxes
  document.querySelectorAll('.cb-q').forEach(el => el.checked = checked);
}
function updateBatchUI() {
  const n = state.batchSel.size;
  const btn = document.getElementById('batchDelBtn');
  const cnt = document.getElementById('batchCount');
  if (btn) btn.style.display = n > 0 ? '' : 'none';
  if (cnt) cnt.textContent = n;
}
function batchDeleteQ() {
  if (state.batchSel.size === 0) { showToast('请先勾选题目', 'warn'); return; }
  if (!confirm('确定删除选中的 ' + state.batchSel.size + ' 道题目？此操作不可恢复！')) return;
  loadQ();
  state.questions = state.questions.filter(q => !state.batchSel.has(q.id));
  saveQ();
  state.batchSel.clear();
  showToast('已删除 ' + state.batchSel.size + ' 道题目', 'success');
  updateBatchUI();
  render();
}

function deleteUser(id) {
  if (!confirm('确定删除该用户？')) return;
  let users = loadUsers();
  users = users.filter(u => u.id !== id);
  saveUsers(users);
  showToast('已删除', 'success');
  render();
}

// ===== FILE UPLOAD =====
async function handleFileUpload(file) {
  if (!file) return;
  const preview = document.getElementById('uploadPreview');
  preview.innerHTML = `<div style="text-align:center;padding:20px"><div style="font-size:24px">⏳</div><p>正在解析 ${file.name}…</p></div>`;
  try {
    const qs = await importExcel(file);
    if (!qs.length) throw new Error('未识别到有效题目');
    preview.innerHTML = `
      <div style="background:var(--primary-light);border-radius:8px;padding:20px;border:1px solid var(--border)">
        <div style="font-size:36px;text-align:center;margin-bottom:8px">📋</div>
        <div style="text-align:center;font-size:15px;font-weight:700;color:var(--primary)">识别到 ${qs.length} 道题目</div>
        <div style="font-size:13px;color:var(--text-light);text-align:center;margin:8px 0">
          ${(()=>{const g={};qs.forEach(q=>{g[q.qtype]=(g[q.qtype]||0)+1;});return Object.entries(g).map(([t,n])=>typeName(t)+': '+n+'题').join(' &nbsp;·&nbsp; ');})()}
        </div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
          <button class="btn btn-outline" onclick="document.getElementById('uploadPreview').innerHTML=''">取消</button>
          <button class="btn btn-primary" onclick="confirmImport(${qs.length})">确认导入</button>
        </div>
      </div>`;
    // Store parsed questions temporarily
    window._pendingImport = qs;
  } catch(err) {
    preview.innerHTML = `<div style="color:var(--danger);padding:16px;text-align:center">解析失败：${err.message}</div>`;
  }
}

function confirmImport(count) {
  const qs = window._pendingImport || [];
  if (!qs.length) return;
  loadQ();
  const newId = Date.now();
  qs.forEach((q,i) => q.id = newId + i);
  state.questions.push(...qs);
  saveQ();
  document.getElementById('uploadPreview').innerHTML = '';
  delete window._pendingImport;
  showToast(`成功导入 ${qs.length} 道题目`, 'success');
  switchAdminTab('questions');
}

// ===== MODAL =====
function openModal(title, body) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3>${title}</h3>
    ${body}
  </div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal() {
  const el = document.getElementById('modalOverlay');
  if (el) el.remove();
}

// ===== TIMER =====
let _timerInterval = null;
function startTimer() {
  clearInterval(_timerInterval);
  _timerInterval = setInterval(() => {
    const el = document.getElementById('timer');
    if (!el) return;
    const elapsed = Math.floor((Date.now() - (state.exam?.startTime||Date.now())) / 1000);
    const m = String(Math.floor(elapsed/60)).padStart(2,'0');
    const s = String(elapsed%60).padStart(2,'0');
    el.textContent = m+':'+s;
  }, 1000);
}

// ===== ATTACH HANDLERS =====
function attachHandlers() {
  if (state.view === 'exam' && !_timerInterval) startTimer();
}

// ===== INIT =====
(function() {
  // Show loading immediately
  document.getElementById('mainContent').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px;color:#666"><div style="font-size:48px">🛡️</div><div style="font-size:16px">加载题库中，请稍候…</div></div>';
  
  loadQ();
  
  function doRender() {
    if (state.questions.length === 0) {
      fetch('questions_bank.json?t=' + Date.now())
        .then(r => { if (r.ok) return r.json(); throw new Error('fetch failed'); })
        .then(qs => {
          localStorage.setItem(Q_KEY, JSON.stringify(qs));
          state.questions = qs;
          console.log('Loaded', qs.length, 'questions');
          render();
        })
        .catch(e => {
          console.warn('Fetch error:', e);
          // Try again with no-cache
          fetch('questions_bank.json', {cache: 'no-store'})
            .then(r => { if (r.ok) return r.json(); throw new Error('no-store failed'); })
            .then(qs => {
              localStorage.setItem(Q_KEY, JSON.stringify(qs));
              state.questions = qs;
              render();
            })
            .catch(e2 => {
              console.error('All fetch attempts failed:', e2);
              document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:60px;color:#666"><div style="font-size:48px">⚠️</div><p style="margin-top:16px">题库加载失败，请刷新重试</p><button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;background:#1a7a3c;color:white;border:none;border-radius:6px;cursor:pointer">刷新页面</button></div>';
            });
        });
    } else {
      render();
    }
  }
  
  doRender();
})();
();
</script>
